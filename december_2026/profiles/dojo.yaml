# dojo (abra): the feeding demo -- the arm level on the bench, so the release generation of arm, arm_state_publisher
# and planner; the wrist D405, the scene Gemini 336L, SAM3, and the feeding module.
#
#   uv run scripts/set_robot.py december_2026/config/robots/dojo   # once per host
#   sheppy up dojo --manifest december_2026/sheppy-manifest.yaml
#
# Attended only: this starts a driver that can move the arm, and `feeding` runs `rammp feed` as soon as it is up
# (rammp-feeding's docs/porting.md sets the site up first). To run the module one command at a time, unselect
# `feeding` and use its image by hand.
description: dojo — the feeding demo; arm + planner on the release, D405 wrist, Gemini 336L scene, SAM3, feeding
selections:
  scene_camera: gemini336l_docker
  wrist_camera: d405_docker
  # One generation for all three; see the manifest's `arm` node.
  arm: kinova_gen3_driver
  arm_state_publisher: kinova_gen3_description
  planner: curobo_planner
  sam3: sam3_docker
  feeding: rammp_feeding_docker
