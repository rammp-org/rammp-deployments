# Arm-only planner config for dojo's bench: the arm's own planner settings,
# with the MEASURED real bench as the collision world -- nothing sim-related
# loads.
#
# This directory is dojo's own, bind-mounted at /config/robot (the manifest's
# planner_nightly mounts config/robots/current there):
#
#   ros2 launch rammp_curobo_ros planner.launch.py config:=/config/robot/curobo/planner.yaml
#
# The robot model is the arm's own URDF from /arm/robot_description (plans and
# the world are in arm_mount); from Python pass it as a file:
#   CuRoboPlanner.from_config('<this file>', urdf_path=path)
#
# Every unlisted knob inherits the same defaults gen3.yaml spells out
# (config.PLANNER_DEFAULTS); see gen3.yaml for the commentary on each.
# Reminder: edit world.yaml to match the real bench BEFORE the
# first hardware run (docs/HARDWARE_BRINGUP.md step 1).

robot: robot.yaml
world: world.yaml

# Repeatable plans (RAMMP-CuRobo#74; an image without it ignores these keys).
# 512 IK seeds find the IK solutions nearest the start every call, and the
# reseed makes one request give one plan: on that repo's chair bench, the same
# request no longer ends ~4.4 rad apart between calls, the goal is ~18% nearer
# and the swept volume ~8% smaller, with no plans lost; ~0.12 s more per plan
# on the Orin. The seed count is fixed at start-up. graph_fallback switches the
# graph planner on after a failed attempt (for routes the straight seed cannot
# find); it needs #74's image, whose cuSOLVER fix it was verified with on abra.
planner:
  num_ik_seeds: 512
  reseed_each_plan: true
  graph_fallback: true
