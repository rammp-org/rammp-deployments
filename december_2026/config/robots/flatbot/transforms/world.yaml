# Joins flatbot's two trees, in rammp-calibration's mounts.yaml format.
# Published by the manifest's static_tf node, alongside cameras.yaml.
#
# The MIB publishes odom -> base_link (/tf); everything on the arm hangs off
# arm_mount. These two links make it one tree: world -> odom -> base_link -> arm_mount.
# world -> odom is identity (#163). base_link -> arm_mount is solved (#167) from two
# measurements of the scene camera: base_link -> scene_camera at [0.5, 1.0, 1.5], and
# its arm_mount -> scene_camera calibration (cameras.yaml). arm_mount is taken level
# with base_link (no rotation), so the offset is [0.5, 1.0, 1.5] minus the calibrated
# position. Replace it when the chair's geometry is measured, or the chair URDF
# publishes it.
mounts:
  ros__parameters:
    transforms: [odom, arm_mount]
    odom:
      parent: world
      child: odom
      xyz: [0.0, 0.0, 0.0]
      quat_xyzw: [0.0, 0.0, 0.0, 1.0]
    arm_mount:
      parent: base_link
      child: arm_mount
      xyz: [0.1936, 1.5723, 1.0730]
      quat_xyzw: [0.0, 0.0, 0.0, 1.0]
