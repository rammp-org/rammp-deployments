          - /wrist_camera/depth/image_rect_raw
          - /scene_camera/color/image_raw
          - /scene_camera/color/camera_info
          - /scene_camera/depth/image_rect_raw
          - /scene_camera/depth/camera_info
          - /perception/object_detections
          # the arm driver's diagnostics: its link to the arm, its e-stop (readiness, a refused goal)
          - /diagnostics
          # the driver's estimate of the force on the tool, logged at the press's hold and the set-down
          - /ee_state
          # the driver's contact monitor's residual, logged per motion (with its contact_debug_topic on)
          - /contact_monitor/residual

  - name: button_press
    description: Microwave button press -- the press_button action (rammp-kitchen-capability-engines)
    select: single
    alternatives:
      # Transcribed from rammp-kitchen-capability-engines' capabilities/button_press/rammp-alternative.yaml
      # (and .mock.yaml) at engines dev adb94c3, diverging as the fridge node above says.
      #
      # Needs arm, arm_state_publisher and planner (nightly: arm_mount frame), static_tf,
      # both cameras and scene_segmenter. The params are flatbot's (mount_rpy_deg pitched 30 deg); on a level
      # mount (dojo) override mount_rpy_deg: [0.0, 0.0, 0.0]. profiles/daily.yaml brings all of them up.
      #
      # Run ONE button_press node: two on the same DDS domain both take every goal. allow_execute false makes
      # every goal a dry run; flip it in the TUI (`p`) only for an attended run, someone on the e-stop.
      # Send a goal as the fridge node shows, to /button_press/execute_action with engine_id button_press (action
      # ids in the engine's docs). Each run's record lands in /home/snorlax/daily/data/button_press.
      - id: button_press_dev
        kind: docker
        ros_node_name: button_press
        container:
          # `:dev` moves on every merge to engines dev, and prefer_latest pulls it at every start (the
          # cached image if the pull fails). The daily demo holds it still with a merge freeze from 4 PM.
          image: ghcr.io/rammp-org/rammp-kitchen-capability-engines/button_press:dev
          pull_policy: prefer_latest
          network_mode: host
          ipc: host
          # The node's installed executable, as the image's CMD runs it; sheppy appends
          # `--ros-args --params-file`. Not `ros2 run`: as PID 1 it swallows the stop signal.
          command: ["/module_ws/install/button_press/lib/button_press/button_press_node"]
          environment:
            CYCLONEDDS_URI: file:///etc/cyclonedds/fleet.xml,file:///etc/cyclonedds/robot.xml
            ROS_DOMAIN_ID: "0"
          volumes:
            # The fleet's DDS config and this robot's interface file, as every docker node here.
            - ./config/robots/current/cyclonedds.xml:/etc/cyclonedds/robot.xml:ro
            - ./config/dds/cyclonedds-fleet.xml:/etc/cyclonedds/fleet.xml:ro
            # The microwave's collision world for the cuRobo planner, written here and loaded by the planner
            # (set_world with its path): the planner container must mount the same host directory at the same
            # path (planner_world_dir), read-only is enough. The fridge capability uses the same directory.
            - /tmp/rammp_planner_worlds:/rammp_planner_worlds
            # Every run's folder (run.jsonl, console.log, bag/), kept on the host. /tmp on the Jetson: copy it off.
            - /home/snorlax/daily/data/button_press:/button_press_data
        params:
          # false: every action is a dry run (detect, plan, gate; nothing moves) and its result says so.
          # true only for attended runs, someone on the e-stop.
          allow_execute: false
          # false: the engine runs standalone, driven by `ros2 action send_goal`; true: it registers
          # with the orchestrator and waits for it (profiles/daily.yaml sets false until it runs).
          use_orchestrator: true
          # The arm base's orientation in arm_mount (the robot's mount.yaml rpy_deg): flatbot 0 30 0.
          mount_rpy_deg: [0.0, 30.0, 0.0]
          # Wrist camera; depth must be aligned to colour. camera_frame "" = the colour image's frame_id.
          camera_frame: ""
          camera_ns: /wrist_camera
          depth_topic: depth/image_rect_raw
          # First look from the scene camera ("scene"), falling back to the wrist camera; "wrist" = wrist only.
          far: scene
          scene_ns: /scene_camera
          scene_depth_topic: depth/image_rect_raw
          # Narrow the scene camera's search to the segmenter's microwave box (/perception/object_detections).
          detections: true
          # A folder per action in this directory (the volume above): run.jsonl (every check), console.log (every
          # progress line and how the run ended) and, record_bag, bag/ (a rosbag: cameras at bag_frame_hz, arm state,
          # WARN+ logs of every node, tf). "" = none.
          log_dir: /button_press_data
          # The pre-press spot is computed (straight in, fingertips 2 cm out); this moves it off the button's detected
          # centre, x right / y up on the panel, mm: set it if a presses-0 run stops off centre (wrist camera mount).
          prepress_aim_mm: [0.0, 0.0]
          record_bag: true
          bag_frame_hz: 1.0
          # cuRobo plans the long moves (staging, back to start, bail) against the microwave and its counter: the
          # node writes them into planner_world_dir (the volume above; the planner sees it at
          # planner_world_dir_in_planner, "" = the same path) and loads them with set_world. A pushed world
          # replaces the robot's world.yaml, so it lists that world's layers again (planner_base_layers, as the
          # planner sees them: flatbot's floor; the chair's layers are the planner config's and stay in every
          # world). planner_restore_world is put back when each action ends.
          planner_world_dir: /rammp_planner_worlds
          planner_world_dir_in_planner: ""
          planner_base_layers: [/config/robot/curobo/layer_mebot_floor.yaml]
          planner_restore_world: world.yaml
          # arm.*: every tunable of self.arm; see Parameters in docs/interface.md.
          "arm.tool_z": 0.12
          "arm.dt": 0.02
          "arm.joint_speed": 0.85
          "arm.cart_speed": 0.16
          "arm.contact_joint_speed": 0.5
          "arm.contact_cart_speed": 0.09
          "arm.min_duration_s": 1.0
          "arm.cart_step_m": 0.02
          "arm.cart_step_deg": 5.0
          "arm.rot_equiv_m": 0.15
          "arm.max_knot_jump_deg": 20.0
          "arm.path_tol_rad": 0.15
          "arm.gripper_force": 0.5
          "arm.gripper_speed": 0.5
          "arm.frame": "arm_mount"
          "arm.go_to_speed_scale": 0.3
          "arm.go_to_timeout_s": 120.0
          # The long (cuRobo) moves only need to end near their goal: 50 cm moves ended 0.5-1.05 cm off
          # with the driver reporting success (2026-10-12). The straight legs keep 1 cm (press_arm).
          "arm.go_to_track_m": 0.05
          "arm.go_to_track_deg": 2.0
          "arm.max_ik_err": 0.02
          "arm.max_step_jump_deg": 20.0
          "arm.j6_guard_deg": 115.0
          "arm.j4_guard_deg": 144.0
          "arm.max_continuous_delta_deg": 170.0
          "arm.keep_out_err": 9.0
          "arm.ik_max_iterations": 200
          "arm.clearance_query_m": 0.5
          "arm.fingertip_open_rad": 0.0
          "arm.finger_closed_rad": 0.7
          "arm.state_wait_s": 10.0
          "arm.state_stale_s": 0.5
          "arm.diagnostics_stale_s": 3.0
          "arm.goal_accept_s": 5.0
          "arm.result_margin_s": 30.0
          "arm.poll_s": 0.01
          "arm.cancel_settle_s": 0.4
          "arm.halt_status_wait_s": 0.2
          "arm.planner_wait_s": 5.0
          "arm.go_to_settle_s": 0.3
          "arm.gripper_period_s": 0.02
          "arm.gripper_moved": 0.002
          "arm.gripper_judge_after_s": 0.5
          "arm.gripper_still_s": 0.3
          "arm.plan_timeout_s": 30.0
          "arm.service_wait_s": 5.0
          "arm.service_call_s": 10.0
          "arm.stream_timeout_s": 0.1
          "arm.publisher_match_s": 1.0
          "arm.close_stream_wait_s": 1.0
          "arm.mock_joints": [0.0, 0.26, 3.14, -2.27, 0.0, 0.96, 1.57]
          "arm.mock_urdf": ""
        publishes:
          - /button_press/status
          - /button_press/target_pose
        subscribes:
          - /tf
          - /tf_static
          - /wrist_camera/color/image_raw
          - /wrist_camera/color/camera_info
          - /wrist_camera/depth/image_rect_raw
          - /scene_camera/color/image_raw
          - /scene_camera/color/camera_info
          - /scene_camera/depth/image_rect_raw
          - /scene_camera/depth/camera_info
          - /perception/object_detections
      - id: button_press_mock
        kind: docker
        container:
          image: ghcr.io/rammp-org/rammp-kitchen-capability-engines/button_press:dev
          network_mode: host
          ipc: host
          command: ["ros2", "launch", "button_press", "button_press.launch.py", "mock:=true"]
          environment:
            CYCLONEDDS_URI: file:///etc/cyclonedds/fleet.xml,file:///etc/cyclonedds/robot.xml
            ROS_DOMAIN_ID: "0"
          volumes:
            # The fleet's DDS config and this robot's interface file, as every docker node here.
            - ./config/robots/current/cyclonedds.xml:/etc/cyclonedds/robot.xml:ro
            - ./config/dds/cyclonedds-fleet.xml:/etc/cyclonedds/fleet.xml:ro
        # No `params:` here: they would need the node's executable as the command, and this fragment uses `ros2 launch` for mock:=true.
        publishes:
          - /button_press/status
          - /button_press/target_pose
        subscribes:
          - /tf
          - /tf_static
          - /wrist_camera/color/image_raw
          - /wrist_camera/color/camera_info
          - /wrist_camera/depth/image_rect_raw
          - /scene_camera/color/image_raw
          - /scene_camera/color/camera_info
          - /scene_camera/depth/image_rect_raw
          - /scene_camera/depth/camera_info
          - /perception/object_detections

  - name: grab_container
    description: Grab the food container -- the tupperware grasp, with a ring-fit grasp point (rammp-kitchen-capability-engines)
    select: single
    alternatives:
      # Transcribed from rammp-kitchen-capability-engines' capabilities/grab_container/rammp-alternative.yaml
      # (and .mock.yaml) at engines dev adb94c3, diverging as the fridge node above says.
      #
      # Needs arm, arm_state_publisher and planner (nightly: arm_mount frame), static_tf,
      # both cameras and scene_segmenter, and the ring detector's model in /home/snorlax/oxo on the host. profiles/daily.yaml brings all of them up.
      #
      # Run ONE grab_container node: two on the same DDS domain both take every goal. allow_execute false makes
      # every goal a dry run; flip it in the TUI (`p`) only for an attended run, someone on the e-stop.
      # Send a goal as the fridge node shows, to /grab_container/execute_action with engine_id grab_container (action
      # ids in the engine's docs). It keeps no data folder on the host.
      - id: grab_container_dev
        kind: docker
        ros_node_name: grab_container
        container:
          # `:dev` moves on every merge to engines dev, and prefer_latest pulls it at every start (the
          # cached image if the pull fails). The daily demo holds it still with a merge freeze from 4 PM.
          image: ghcr.io/rammp-org/rammp-kitchen-capability-engines/grab_container:dev
          pull_policy: prefer_latest
          network_mode: host
          ipc: host
          # The node's installed executable, as the image's CMD runs it; sheppy appends
          # `--ros-args --params-file`. Not `ros2 run`: as PID 1 it swallows the stop signal.
          command: ["/module_ws/install/grab_container/lib/grab_container/grab_container_node"]
          environment:
            CYCLONEDDS_URI: file:///etc/cyclonedds/fleet.xml,file:///etc/cyclonedds/robot.xml
            ROS_DOMAIN_ID: "0"
          # The ring detector's weights (model_path) on the flatbot; they are not in the image.
          volumes:
            # The fleet's DDS config and this robot's interface file, as every docker node here.
            - ./config/robots/current/cyclonedds.xml:/etc/cyclonedds/robot.xml:ro
            - ./config/dds/cyclonedds-fleet.xml:/etc/cyclonedds/fleet.xml:ro
            - /home/snorlax/oxo:/models:ro
          # The ring detector's YOLO runs on the GPU (the mock has none and needs none).
          gpus: all
        params:
          # false: every goal is a dry run (grab: detect and plan; park: report), whatever it asks.
          # true only for attended runs, someone on the e-stop.
          allow_execute: false
          # false: the engine runs standalone, driven by `ros2 action send_goal`; true: it registers
          # with the orchestrator and waits for it (profiles/daily.yaml sets false until it runs).
          use_orchestrator: true
          # The YOLO segmentation weights with the ring's `grabber` class (the volume above).
          model_path: /models/best.pt
          # Wrist camera (the flatbot's OAK-D); depth must be aligned to colour. camera_frame "" = the
          # colour image's frame_id.
          color_topic: /wrist_camera/color/image_raw
          camera_info_topic: /wrist_camera/color/camera_info
          depth_topic: /wrist_camera/depth/image_rect_raw
          camera_frame: ""
          # The scene segmenter (rammp-perception) and the scene camera it runs on: the container's
          # coarse position, before the wrist camera's view.
          detections_topic: /perception/object_detections
          scene_color_topic: /scene_camera/color/image_raw
          scene_camera_info_topic: /scene_camera/color/camera_info
          scene_depth_topic: /scene_camera/depth/image_rect_raw
          # The grasp point along the approach from the brim's outer edge (m; negative: short of it).
          grasp_depth_m: -0.008
          # New frames whose brim edges must agree.
          detect_frames: 5
          # Where grab starts (rad, arm_joint_1..7 as /joint_states reports them).
          home_joints: [0.067, -1.8971, -3.137, -2.2691, -0.211, -0.6831, 1.725]
          # The driver's impedance profile for `impedance` goals: default, soft, medium or stiff.
          impedance_gains: default
          # arm.*: every tunable of self.arm; see Parameters in docs/interface.md.
          "arm.tool_z": 0.12
          "arm.dt": 0.02
          "arm.joint_speed": 0.85
          "arm.cart_speed": 0.16
          "arm.contact_joint_speed": 0.5
          "arm.contact_cart_speed": 0.09
          "arm.min_duration_s": 1.0
          "arm.cart_step_m": 0.02
          "arm.cart_step_deg": 5.0
          "arm.rot_equiv_m": 0.15
          "arm.max_knot_jump_deg": 20.0
          "arm.path_tol_rad": 0.15
          "arm.gripper_force": 0.5
          "arm.gripper_speed": 0.5
          "arm.frame": "arm_mount"
          "arm.go_to_speed_scale": 0.8
          "arm.go_to_timeout_s": 120.0
          "arm.go_to_track_m": 0.01
          "arm.go_to_track_deg": 2.0
          "arm.max_ik_err": 0.02
          "arm.max_step_jump_deg": 20.0
          "arm.j6_guard_deg": 115.0
          "arm.j4_guard_deg": 144.0
          "arm.max_continuous_delta_deg": 170.0
          "arm.keep_out_err": 9.0
          "arm.ik_max_iterations": 200
          "arm.clearance_query_m": 0.5
          "arm.fingertip_open_rad": 0.0
          "arm.finger_closed_rad": 0.7
          "arm.state_wait_s": 10.0
          "arm.state_stale_s": 0.5
          "arm.diagnostics_stale_s": 3.0
          "arm.goal_accept_s": 5.0
          "arm.result_margin_s": 30.0
          "arm.poll_s": 0.01
          "arm.cancel_settle_s": 0.4
          "arm.halt_status_wait_s": 0.2
          "arm.planner_wait_s": 5.0
          "arm.go_to_settle_s": 0.3
          "arm.gripper_period_s": 0.02
          "arm.gripper_moved": 0.002
          "arm.gripper_judge_after_s": 0.5
          "arm.gripper_still_s": 0.3
          "arm.plan_timeout_s": 30.0
          "arm.service_wait_s": 5.0
          "arm.service_call_s": 10.0
          "arm.stream_timeout_s": 0.1
          "arm.publisher_match_s": 1.0
          "arm.close_stream_wait_s": 1.0
          "arm.mock_joints": [0.0, 0.26, 3.14, -2.27, 0.0, 0.96, 1.57]
          "arm.mock_urdf": ""
        publishes: [/grab_container/status]
