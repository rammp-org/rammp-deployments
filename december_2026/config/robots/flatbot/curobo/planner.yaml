# flatbot's cuRobo planner config: the Gen3 on the MEBot wheelchair, on the
# chair's LEFT with the joystick on the right, tilted 30 degrees forward on its
# mount (../mount.yaml), with the chair's drive base and its occupant in every
# collision world.
#
# The planner reads this directory as /config/robot/curobo (the manifest's
# planner_nightly bind-mounts config/robots/current at /config/robot), selected
# by profiles/flatbot.yaml:
#
#   config:=/config/robot/curobo/planner.yaml   world:=""
#
# `world` must be "": a non-empty world parameter replaces the one named here.
#
# The three layer_mebot_*.yaml are GENERATED by RAMMP-CuRobo's
# scripts/generate_layers.py from its scripts/mebot_layers.yaml and the pinned
# MEBot URDF; never hand-edit them. To change the chair, edit those inputs
# there and write this copy with
#
#   make layers OUTDIR=<this checkout>/december_2026/config/robots/flatbot/curobo
#
# The arm's tilt in those inputs (mount.arm_base_joint.rpy_deg) must equal
# ../mount.yaml's rpy_deg. The chair geometry is Gen1.2 and the arm's position
# on it the RAMMS model's, mirrored to the left: neither is measured on this
# chair yet.
#
# The platform and the person are composed into EVERY world, set_world pushes
# included; a push replaces world.yaml's floor, so a pushed scene brings its
# own floor. The bench retract (cuRobo's IK seed) is inside the padded person,
# so it is no valid start here: plan from the arm's measured state.
#
# world_padding stays the 0.02 default: the layers are certified for it, and
# the planner refuses less.

robot: robot_gen3_2f85.yaml
world: world.yaml
layers: [layer_mebot_platform.yaml, layer_mebot_person.yaml]
