          # The node's installed executable, as the image's CMD runs it; sheppy appends
          # `--ros-args --params-file`. Not `ros2 run`: as PID 1 it swallows the stop signal.
          command: ["/module_ws/install/microwave/lib/microwave/microwave_node"]
          environment:
            CYCLONEDDS_URI: file:///etc/cyclonedds/fleet.xml,file:///etc/cyclonedds/robot.xml
            ROS_DOMAIN_ID: "0"
          # The door geometry and grasp the open saves (the close reads them back) and every run's log:
          # kept on the host, across container restarts.
          volumes:
            # The fleet's DDS config and this robot's interface file, as every docker node here.
            - ./config/robots/current/cyclonedds.xml:/etc/cyclonedds/robot.xml:ro
            - ./config/dds/cyclonedds-fleet.xml:/etc/cyclonedds/fleet.xml:ro
            - /home/snorlax/daily/data/microwave:/microwave_data
          # The GPU, through JetPack's NVIDIA runtime, not --gpus (10-29 on snorlax: "invoking the NVIDIA Container Runtime
          # Hook directly ... is not supported"). It was for the YOLO handle detector, gone 11-09; nothing needs it now.
          runtime: nvidia
        params:
          # false: every goal is a dry run (detect, plan, gate; nothing moves), whatever it asks.
          # true only for attended runs, someone on the e-stop.
          allow_execute: false
          # false: the engine runs standalone, driven by `ros2 action send_goal`; true: it registers
          # with the orchestrator and waits for it (profiles/daily.yaml sets false until it runs).
          use_orchestrator: true
          data_dir: /microwave_data
          # Wrist camera; depth must be aligned to colour. camera_frame "" = the colour image's frame_id.
          # depth/image_rect_raw is every wrist camera's, and aligned to colour on the D405 and the OAK; the
          # D435i's is not -- with it, override this to /wrist_camera/aligned_depth_to_color/image_raw.
          color_topic: /wrist_camera/color/image_raw
          camera_info_topic: /wrist_camera/color/camera_info
          depth_topic: /wrist_camera/depth/image_rect_raw
          camera_frame: ""
          # Scene camera, depth aligned to colour: without boxer, its view of the door places the view pose.
          scene_color_topic: /scene_camera/color/image_raw
          scene_camera_info_topic: /scene_camera/color/camera_info
          scene_depth_topic: /scene_camera/depth/image_rect_raw
          # The scene segmenter's 2D boxes on the scene camera (RF-DETR): its box_class box is where the door is looked for.
          scene_detections_topic: /perception/object_detections
          # boxer's 3D boxes (scene camera): the handle detector crops the wrist camera's points to the
          # microwave's box. "" = the scene camera's door (scene_detections_topic) instead.
          box_topic: ""  # /perception/object_detections_3d to use boxer
          box_class: microwave
          # The view pose in front of the box: camera distances out from its front face and heights above
          # its middle (m), tried in order. Per camera and setup.
          view_dists: [0.30, 0.25, 0.35, 0.40]
          view_heights: [0.15, 0.20, 0.10, 0.25, 0.05]
          # ... and sideways along the face, away from the user (+y): tried first, so the hand stays off the user's lap.
          view_sides: [0.10, 0.15, 0.05, 0.0]
          # How far out (m, arm base to the tool point) any goal and the swing may reach. Near full stretch past ~0.90.
          max_reach_m: 0.90
          # The grasp's own limit (arm base to the grasp point); raise it with max_reach_m.
          grasp_max_reach_m: 0.915
          # Every run's rosbag (in its run folder): both cameras' colour, depth and intrinsics bag_frame_hz times a
          # second, the detections and TF (~75 MB a minute at 0.5); no more frames past bag_max_mb.
          record_bag: true
          bag_frame_hz: 0.5
          bag_max_mb: 300.0
          # The wrist camera's rectified stereo pair in the bag too (~15 MB a minute more at 0.5); "" = not recorded.
          wrist_infra1_topic: ""
          wrist_infra1_info_topic: ""
          wrist_infra2_topic: ""
          wrist_infra2_info_topic: ""
          # arm.*: every tunable of self.arm; see Parameters in docs/interface.md.
          "arm.tool_z": 0.12
          "arm.dt": 0.02
          "arm.joint_speed": 0.85
          "arm.cart_speed": 0.16
          "arm.contact_joint_speed": 0.5
          "arm.contact_cart_speed": 0.09
          "arm.min_duration_s": 1.0
          "arm.cart_step_m": 0.02
          "arm.cart_step_deg": 5.0
          "arm.rot_equiv_m": 0.15
          "arm.max_knot_jump_deg": 20.0
          "arm.path_tol_rad": 0.15
          "arm.gripper_force": 0.5
          "arm.gripper_speed": 0.5
          "arm.frame": "arm_mount"
          "arm.go_to_speed_scale": 0.3
          "arm.go_to_timeout_s": 120.0
          "arm.go_to_track_m": 0.01
          "arm.go_to_track_deg": 2.0
          "arm.max_ik_err": 0.02
          "arm.max_step_jump_deg": 20.0
          "arm.j6_guard_deg": 115.0
          "arm.j4_guard_deg": 144.0
          "arm.max_continuous_delta_deg": 170.0
          "arm.keep_out_err": 9.0
          "arm.ik_max_iterations": 200
          "arm.clearance_query_m": 0.5
          "arm.fingertip_open_rad": 0.0
          "arm.finger_closed_rad": 0.7
          "arm.state_wait_s": 10.0
          "arm.state_stale_s": 0.5
          "arm.diagnostics_stale_s": 3.0
          "arm.goal_accept_s": 5.0
          "arm.result_margin_s": 30.0
          "arm.poll_s": 0.01
          "arm.cancel_settle_s": 0.4
          "arm.halt_status_wait_s": 0.2
          "arm.planner_wait_s": 5.0
          "arm.go_to_settle_s": 0.3
          "arm.gripper_period_s": 0.02
          "arm.gripper_moved": 0.002
          "arm.gripper_judge_after_s": 0.5
          "arm.gripper_still_s": 0.3
          "arm.plan_timeout_s": 30.0
          "arm.service_wait_s": 5.0
          "arm.service_call_s": 10.0
          "arm.stream_timeout_s": 0.1
          "arm.publisher_match_s": 1.0
          "arm.close_stream_wait_s": 1.0
          "arm.mock_joints": [0.0, 0.26, 3.14, -2.27, 0.0, 0.96, 1.57]
          "arm.mock_urdf": ""
        publishes: [/microwave/status]
        subscribes:
          - /tf
          - /tf_static
          - /wrist_camera/color/image_raw
          - /wrist_camera/color/camera_info
          - /wrist_camera/depth/image_rect_raw
          - /scene_camera/color/image_raw
          - /scene_camera/color/camera_info
          - /scene_camera/depth/image_rect_raw
          - /perception/object_detections
          - /perception/object_detections_3d
      - id: microwave_mock
        kind: docker
        container:
          image: ghcr.io/rammp-org/rammp-kitchen-capability-engines/microwave:dev
          network_mode: host
          ipc: host
          # To give make_sim() a model, append "mock_urdf:=/path/to/robot.urdf" (arm.mock_urdf).
          command: ["ros2", "launch", "microwave", "microwave.launch.py", "mock:=true"]
          environment:
            CYCLONEDDS_URI: file:///etc/cyclonedds/fleet.xml,file:///etc/cyclonedds/robot.xml
            ROS_DOMAIN_ID: "0"
          volumes:
