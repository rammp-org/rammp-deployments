# The gate that matters here. This repo ships manifests and nothing else, so
# the only honest check is whether sheppy can load them.
name: Validate manifests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manifests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # From git at @dev, not a release: the robots run sheppy's dev branch
      # (the manifest's relative bind mounts need #149, which no tag has yet).
      # A moving dependency is the point here rather than a compromise — a
      # manifest that only validates against a sheppy older than the one on the
      # robot is telling us nothing. When sheppy tags a release, pin this to it.
      - name: Install sheppy
        run: pip install "sheppy @ git+https://github.com/rammp-org/sheppy@dev"

      - name: Validate every manifest
        run: python3 scripts/validate_manifest.py

      # Robot configs are applied by uv scripts on the robot; CI can only prove
      # each one parses and means something. --validate touches nothing else.
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.17"

      - name: Validate every robot config
        run: |
          shopt -s nullglob
          status=0
          for robot in */config/robots/*/; do
            if [ -f "$robot/network.yaml" ]; then
              uv run scripts/network_config.py --validate "$robot" || status=1
            fi
            if [ -f "$robot/oak_d.yaml" ]; then
              uv run scripts/oak_d_config.py --validate "$robot" || status=1
            fi
            if [ -f "$robot/mount.yaml" ]; then
              uv run scripts/set_robot.py --validate "$robot" || status=1
            fi
            if [ -d "$robot/transforms" ]; then
              uv run scripts/static_tf.py --validate "$robot/transforms" || status=1
            fi
          done
          exit "$status"
