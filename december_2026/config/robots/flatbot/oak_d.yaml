# OAK-D PoE cameras on flatbot, by device ID (MxID). Keys are the manifest's node names.
# Applied by: uv run scripts/oak_d_config.py december_2026/config/robots/flatbot
#
# dhcp stores no fallback address: on bootloader <=0.0.29 a stored address
# disables DHCP even with staticIpv4 false.
cameras:
  # Two ways to cable it; switching is in README.md, "Switching the wrist camera".
  wrist_camera:
    device_id: "194430107187F42E00"
    # Behind the arm, broadcast discovery cannot see it: ask here. Kept in both
    # setups, so the script can also find it there to flash it back to DHCP.
    reach_at: 10.20.0.50
    # On the ESP32-P4 sensor network (PoE switch on eno1):
    ipv4:
      method: dhcp
    # Through the Kinova Vision Puck: the arm's wrist subnet, routed by the arm
    # base (network.yaml, arm.yaml). Kinova's addresses.
    # ipv4:
    #   method: static
    #   address: 10.20.0.50/24
    #   gateway: 10.20.0.1
  scene_camera:
    device_id: "19443010219A974800"
    ipv4:
      method: dhcp
