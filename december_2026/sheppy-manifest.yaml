# Sheppy manifest for the December 2026 demo. Launch from the demo machine:
#   sheppy december_2026/sheppy-manifest.yaml
#
# Cameras, the arm, the arm's TF, operator teleop and perception (the always-on scene segmenter, SAM3
# and 3D boxes for its objects) so far; the demo modules land here as their module repos publish fragments.
#
# Every node carries a mock alternative alongside the real one, so a profile
# selecting only mocks runs on a workstation with no hardware attached. The
# mocks publish empty messages at the right topic and type — enough to develop
# wiring against, and deliberately not a simulation.
#
# DDS: everything here speaks Cyclone. Images built FROM rammp-base set
# RMW_IMPLEMENTATION and bake the fleet's Cyclone config (AllowMulticast spdp,
# ParticipantIndex none) at /etc/cyclonedds/config.xml. No node sets
# RMW_IMPLEMENTATION. Every docker node sets CYCLONEDDS_URI to that file plus the
# active robot's config/robots/<robot>/cyclonedds.xml, mounted at
# /etc/cyclonedds/robot.xml, which names the robot's network interface and
# nothing else (flatbot and gen_1_5, both run from snorlax: eno1, the base's
# network; gen_1_5's file is a symlink to flatbot's). Cyclone merges the two in
# order. That needs an image config with no interface of its own (rammp-base
# 2.1.0-jp6 or newer, rammp-curobo 2.0.2 or newer). The nodes whose images
# still autodetermine one (the rammp-curobo and kinova-gen3-ros2 nightlies,
# rammp-feeding) take config/dds/cyclonedds-fleet.xml, a copy of rammp-base's
# file, in its place until they are rebuilt.
#
# Container definitions are inline rather than a `compose:` reference: sheppy
# resolves a compose file relative to this manifest, so a reference would mean
# carrying a second copy of the dojo's compose.yaml here to drift against.
# Inline blocks are not variable-interpolated (compose files are), so anything
# that was `${VAR:-default}` in the dojo is spelled out below.
machines: []
nodes:
  - name: scene_camera
    description: Orbbec Gemini 336L, scene view
    select: single
    alternatives:
      # Built and published by rammp-suite-software.
      - id: gemini336l_docker
        kind: docker
        container:
          image: ghcr.io/rammp-org/rammp-suite-software/gemini:0.5.1
          # Userspace-USB device: privileged + /dev survives replugs. The
          # camera needs no root, so it runs as the host user.
          privileged: true
          network_mode: host
          ipc: host
          volumes:
            - ./config/robots/current/cyclonedds.xml:/etc/cyclonedds/robot.xml:ro
            - /dev:/dev
          user: "1000:1000"
          environment:
            CYCLONEDDS_URI: file:///etc/cyclonedds/config.xml,file:///etc/cyclonedds/robot.xml
            ROS_DOMAIN_ID: "0"
            HOME: /tmp
          # The image's entrypoint runs the node with its defaults; only the
          # rename is appended. This driver names by namespace.
          command: [--ros-args, -r, __ns:=/scene_camera]
        params:
          # tf frame prefix, kept equal to the namespace.
          camera_name: scene_camera
          # Which Gemini, from `ros2 run orbbec_camera list_devices_node`.
          # Empty = the only one on the machine.
          serial_number: ""
          # <width>, <height>, <fps>; 0 = the device's default profile.
          color_width: 0
          color_height: 0
          color_fps: 0
          depth_width: 0
          depth_height: 0
          depth_fps: 0
          # Depth registered to color: depth/image_raw and depth/points come out at the color camera's
          # resolution and in its frame. object_lifter needs this. When changing it on a running stack,
          # check the camera actually restarted with it (rammp-org/sheppy#182).
          depth_registration: true
        publishes:
          - /scene_camera/color/image_raw
          - /scene_camera/depth/image_raw
          - /scene_camera/depth/points
      # Wide-angle alternative: OAK-D Pro W PoE, 127° HFOV on the stereo pair
      # and on the OV9782 color sensor (the "97" variant). Same image as the
      # wrist OAK; only params differ. Color matches the Gemini's topic; depth
      # is depth/image_rect_raw (RealSense naming) and there is no points topic.
      - id: oak_d_pro_w_docker
        kind: docker
        container:
          # 0.4.0: the driver from our depthai-ros fork (i_rotation, synced + encoded color, and #7: the
          # host-side filters, rotation and Sync below).
          image: ghcr.io/rammp-org/rammp-suite-software/oak:0.5.1
          # PoE camera: reached over the network, so no /dev and no privileges.
          network_mode: host
          ipc: host
          volumes:
            - ./config/robots/current/cyclonedds.xml:/etc/cyclonedds/robot.xml:ro
          environment:
            CYCLONEDDS_URI: file:///etc/cyclonedds/config.xml,file:///etc/cyclonedds/robot.xml
            ROS_DOMAIN_ID: "0"
          command: [--ros-args, -r, __node:=scene_camera]
        params:
          # Which OAK: the device ID (MxID), as in the robot's oak_d.yaml.
          # Found by discovery, so the camera's address can change (DHCP)
          # without touching this; it must be on a subnet the host is on.
          driver.i_device_id: "19443010219A974800"
          driver.i_tf_base_frame: scene_camera
          driver.i_tf_parent_frame: scene_camera_link
          # The driver undistorts color by default, which is what makes the
          # wide lens usable as-is.
          # 640x400 @ 15 fps (2026-10-22): 1280x800 @ 30 raw put 677 Mbit/s on
          # eno1 and the camera delivered only ~15 Hz at 550 ms (depth 1 s)
          # age; 640x400 @ 15 delivers 15 Hz at 24-31 ms.
          color.i_width: 640
          color.i_height: 400
          color.i_fps: 15.0
          color.i_synced: true
          # Stereo at 1280x800, depth still aligned to (and published at) the
          # 640x400 color, so the link load does not change. Against an 800P
          # multi-frame reference on the microwave (2026-10-31, snorlax): edge
          # pixels right 0.39 -> 0.90, side face 0.41-0.55 -> 0.92, front/side
          # face angle 86.8 -> 88.3 deg (90 is right), at 46 ms message age
          # (49-53 ms before). Costs: minimum depth 22 -> 45 cm (closer
          # surfaces can come back as false depth); ~10% of the door's glass
          # still returns the oven's inside (1-2% before).
          depth.i_width: 1280
          depth.i_height: 800
          depth.i_fps: 15.0
          depth.i_synced: true
          # Synced, as on the wrist (see its sync_threshold), so each color
          # frame's depth carries the same stamp. Unsynced, only half the color
          # frames had depth within 20 ms, which consumers pairing by stamp
          # (boxer) had to cover with a wider slop. On the host: the depth is
          # filtered there (below), and a device Sync would ship it back
          # (~0.7 s of lag).
          sync.sync_threshold: 33
          sync.i_run_on_host: true
          # No preset filters on the device: at 1280x800 ROBOTICS' speckle and
          # spatial filters cost ~85 ms per frame on the SHAVEs (173 ms age),
          # and its decimation halves the resolution again. FAST_ACCURACY plus
          # the stereo block's own median (free; FAST_ACCURACY alone streaks
          # along rows, 2026-10-26), then speckle and spatial on the host
          # (~1-2 and ~5 ms on the Orin).
          depth.i_depth_preset: FAST_ACCURACY
          depth.i_median_filter: KERNEL_5x5
          # Accept lower-confidence matches (the driver's default is 15).
          depth.i_stereo_conf_threshold: 5
          # Drops isolated blobs, e.g. the oven's inside matched through the
          # door glass (28% of door pixels without it). Depth step in mm.
          depth.i_host_speckle_filter: true
          depth.i_host_speckle_filter_speckle_range: 200
          depth.i_host_speckle_filter_difference_threshold: 200
          depth.i_host_spatial_filter: true
          depth.i_host_spatial_filter_alpha: 0.7
          depth.i_host_spatial_filter_delta: 30
          depth.i_host_spatial_filter_hole_filling_radius: 5
          depth.i_host_spatial_filter_iterations: 1
          # Full-power dots and no flood (driver defaults 0.6 / 0.6): the flood
          # LED only lifts the background under the dot pattern stereo matches
          # on. Turning the projector off cut fill on the microwave's
          # textureless side face from 0.83 to 0.51.
          driver.r_laser_dot_intensity: 1.0
          driver.r_floodlight_intensity: 0.0
          # The joystick mount holds the camera right side up (the mount before
          # it held it upside down, rotated 180° here), so no rotation. If it is remounted
          # upside down, set both to 180: both, so depth stays registered to
          # color. The frame names do not change either way: the mount in the
          # robot's transforms/cameras.yaml is the upright camera's.
          color.i_rotation: 0
          depth.i_rotation: 0
          # Rotate on the host, not the device: ~20 ms less message age. Both
          # outputs leave the camera unencoded, so the flip is ~1 ms here.
          color.i_rotate_on_host: true
          depth.i_rotate_on_host: true
        publishes:
          - /scene_camera/color/image_raw
          - /scene_camera/depth/image_rect_raw
      - id: scene_camera_mock
        kind: process
        command: "bash -lc 'source /opt/ros/humble/setup.bash && ros2 topic pub -r 10 /scene_camera/color/image_raw sensor_msgs/msg/Image \"{}\"'"
        publishes:
          - /scene_camera/color/image_raw

  - name: wrist_camera
    description: Wrist-mounted RGB-D camera — RealSense D405, D435i, or OAK-D Pro
    select: single
    alternatives:
      - id: d405_docker
        kind: docker
        container:
          image: ghcr.io/rammp-org/rammp-suite-software/realsense:0.5.1
          privileged: true
          network_mode: host
          ipc: host
          volumes:
            - ./config/robots/current/cyclonedds.xml:/etc/cyclonedds/robot.xml:ro
            - /dev:/dev
          # gid 44 = video: librealsense streams over V4L2, and /dev/video* is
          # root:video 0660. The Orbbec needs no such group (libusb, node 0666).
          user: "1000:44"
          environment:
            CYCLONEDDS_URI: file:///etc/cyclonedds/config.xml,file:///etc/cyclonedds/robot.xml
            ROS_DOMAIN_ID: "0"
            HOME: /tmp
          # The image's entrypoint runs the node with its defaults; only the
          # rename is appended.
          command: [--ros-args, -r, __node:=wrist_camera]
        params:
          # Which RealSense: leading underscore, from rs-enumerate-devices.
          serial_no: "_260322274242"
          # <width>x<height>x<fps>, the D405's default profile. Its color
          # comes off the depth module, hence depth_module.color_profile. On
          # abra the camera hangs off a USB 2 port, which caps this at ~10 fps
          # until it moves to a USB 3 one.
          depth_module.color_profile: 848x480x30
          depth_module.depth_profile: 848x480x30
        publishes:
          - /wrist_camera/color/image_raw
          - /wrist_camera/depth/image_rect_raw
      # Same topics as the D405, so consumers cannot tell which is selected —
      # except at range: the D405 sees from ~7 cm, this from ~24 cm (75 mm
      # baseline; the stereo below trades near range for detail, see params).
      - id: oak_d_pro_docker
        kind: docker
        # Anchored: oak_d_pro_puck_docker below is this camera through the arm.
        container: &oak_wrist_container
          # 0.4.0: the driver from our depthai-ros fork with #7 (the host-side filters and Sync below).
          image: ghcr.io/rammp-org/rammp-suite-software/oak:0.5.1
          # PoE camera: reached over the network, so no /dev and no privileges.
          network_mode: host
          ipc: host
          # From 0.3.1 the container exits 1 if no camera matching the device
          # ID is ready within RAMMP_OAK_READY_TIMEOUT seconds (default 60),
          # so a wrong ID or an unplugged camera shows as crashed. Both OAKs.
          # H.264 color (#85): the camera encodes color on the device, and the
          # image decodes it back onto color/image_raw with the same stamps, so
          # consumers see raw images as before. Needs the color.i_low_bandwidth
          # params below.
          volumes:
            - ./config/robots/current/cyclonedds.xml:/etc/cyclonedds/robot.xml:ro
          environment: &oak_wrist_env
            CYCLONEDDS_URI: file:///etc/cyclonedds/config.xml,file:///etc/cyclonedds/robot.xml
            ROS_DOMAIN_ID: "0"
            RAMMP_OAK_COLOR_CODEC: h264
          # The image's entrypoint runs the node with the driver's defaults;
          # only the rename is appended, and the wrist tuning lives in params.
          command: [--ros-args, -r, __node:=wrist_camera]
        params: &oak_wrist_params
          # Which OAK: the device ID (MxID), as in the robot's oak_d.yaml.
          # Found by discovery, so the camera's address can change (DHCP)
          # without touching this; it must be on a subnet the host is on, or
          # be asked for by address (oak_d_pro_puck_docker).
          driver.i_device_id: "194430107187F42E00"
          driver.i_tf_base_frame: wrist_camera
          driver.i_tf_parent_frame: wrist_camera_link
          pipeline_gen.i_enable_imu: false
          color.i_width: 640
          color.i_height: 400
          color.i_fps: 15.0
          color.i_synced: true
          # The wrist link is 100 Mbit/s (#85). Raw color put 129 Mbit/s on it;
          # H.264 (profile 2) brings the camera to 83 Mbit/s, most of it the
          # aligned depth (2026-10-27, snorlax).
          color.i_low_bandwidth: true
          color.i_low_bandwidth_profile: 2
          color.i_publish_compressed: true
          depth.i_fps: 15.0
          depth.i_synced: true
          # The device-side Sync node pairs color and depth only when their
          # stamps are within this many ms (driver 3.3.0 default 10). The
          # sensors are not phase-locked, so at 15 fps the default starved the
          # pairing to 2.5 Hz; use half the frame period (33 ms at 15 fps,
          # 16 at 30). The driver stamps both messages with color's stamp.
          # On the host: the depth is filtered there (below), and a device Sync
          # would ship it back to the camera (~0.7 s of lag).
          sync.sync_threshold: 33
          sync.i_run_on_host: true
          # Stereo at 640x400, the color size, so depth keeps the detail of
          # task features: the microwave handle (~30 mm proud of the door) at
          # ~0.5 m shows in 61% of its rows, against none at 320x200 with
          # ROBOTICS, whose 7x7 median and spatial filter smear it into the door
          # (2026-10-31, snorlax, against a FoundationStereo reference). Depth
          # is aligned to 640x400 color either way, so the link load does not
          # change: 63 Mbit/s measured (2026-11-01).
          depth.i_width: 640
          depth.i_height: 400
          # Extended disparity over a 64-pixel search (126 px) reaches 23.8 cm;
          # plain 640x400 stops at 31.6 cm and reports closer surfaces as false
          # depth near that limit. The default 96-pixel search (190 px) would
          # reach 15.8 cm, but that range is past the median filter's limit:
          # the device drops the median and depth streaks along rows.
          depth.i_extended_disp: true
          depth.i_disparity_width: DISPARITY_64
          # No preset filters on the camera: FAST_ACCURACY plus the stereo
          # block's own median (free; FAST_ACCURACY alone streaks along rows),
          # then speckle and spatial filters in the driver on the host. Fill
          # around the handle 0.98 (0.85 with the median alone, same handle
          # rows within a pose's noise).
          depth.i_depth_preset: FAST_ACCURACY
          depth.i_median_filter: KERNEL_5x5
          # Accept lower-confidence matches (the driver's default is 15).
          depth.i_stereo_conf_threshold: 5
          # Drops isolated blobs. Depth step in mm.
          depth.i_host_speckle_filter: true
          depth.i_host_speckle_filter_speckle_range: 200
          depth.i_host_speckle_filter_difference_threshold: 200
          depth.i_host_spatial_filter: true
          depth.i_host_spatial_filter_alpha: 0.7
          depth.i_host_spatial_filter_delta: 30
          depth.i_host_spatial_filter_hole_filling_radius: 5
          depth.i_host_spatial_filter_iterations: 1
          # Full-power dots and no flood (driver defaults 0.6 / 0.6): the flood
          # LED only lifts the background under the dot pattern stereo matches
          # on, and the white microwave front has little texture of its own.
          driver.r_laser_dot_intensity: 1.0
          driver.r_floodlight_intensity: 0.0
          # Mounted upside down: rotate color and depth 180° on the device
          # (not the host, as the scene OAK can: color leaves
          # this camera H.264-encoded). The frame names do not change: the mount
          # in the robot's transforms/cameras.yaml is the rotated (upright) one.
          color.i_rotation: 180
          depth.i_rotation: 180
        publishes:
          - /wrist_camera/color/image_raw
          - /wrist_camera/depth/image_rect_raw
      # The same OAK-D Pro, cabled through the arm by the Kinova Vision Puck: it
      # sits on the arm's wrist subnet, routed by the arm base (the robot's
      # network.yaml routes it; arm.yaml turns the wrist port on), where broadcast
      # discovery cannot reach. DEPTHAI_DEVICE_NAME_LIST makes depthai ask that
      # address instead, and it answers with its device ID, so the params above
      # find it unchanged. Not driver.i_ip: the 3.3.0 driver tries the IP only when
      # discovery finds no camera at all, and then cannot connect with it.
      # The link is 100 Mbit/s half duplex (the robot's arm.yaml); this camera's
      # tuning measured 63-83 Mbit/s on a 100 Mbit/s link.
      - id: oak_d_pro_puck_docker
        kind: docker
        container:
          <<: *oak_wrist_container
          # `<<:` replaces a nested mapping whole, so the env merges its own anchor.
          environment:
            <<: *oak_wrist_env
            # Kinova's address for the camera behind the Puck (oak_d.yaml).
            DEPTHAI_DEVICE_NAME_LIST: 10.20.0.50
        params: *oak_wrist_params
        publishes:
          - /wrist_camera/color/image_raw
          - /wrist_camera/depth/image_rect_raw
      # Same topics again. The image's entrypoint already runs the node with
      # /etc/rammp/realsense/d435i.yaml, so the command is only the rename and
      # the framerate lives in `params:`, which sheppy appends as a params file
      # that overrides the image's defaults. A longer-range sensor than the
      # D405: its minimum depth is tens of centimetres, not ~7 cm. Its IMU is
      # off on abra: the Tegra kernel has no HID-sensor IIO drivers, and the
      # node says so at startup.
      - id: d435i_docker
        kind: docker
        container:
          image: ghcr.io/rammp-org/rammp-suite-software/d435i:0.5.1
          privileged: true
          network_mode: host
          ipc: host
          volumes:
            - ./config/robots/current/cyclonedds.xml:/etc/cyclonedds/robot.xml:ro
            - /dev:/dev
          user: "1000:44"
          environment:
            CYCLONEDDS_URI: file:///etc/cyclonedds/config.xml,file:///etc/cyclonedds/robot.xml
            ROS_DOMAIN_ID: "0"
            HOME: /tmp
          command: [--ros-args, -r, __node:=wrist_camera]
        params:
          # <width>x<height>x<fps>
          rgb_camera.color_profile: 640x480x30
          depth_module.depth_profile: 640x480x30
          # Which RealSense: leading underscore, from rs-enumerate-devices.
          serial_no: "_950122071279"
        publishes:
          - /wrist_camera/color/image_raw
          - /wrist_camera/depth/image_rect_raw
          - /wrist_camera/aligned_depth_to_color/image_raw
      - id: wrist_camera_mock
        kind: process
        command: "bash -lc 'source /opt/ros/humble/setup.bash && ros2 topic pub -r 10 /wrist_camera/color/image_raw sensor_msgs/msg/Image \"{}\"'"
        publishes:
          - /wrist_camera/color/image_raw

  - name: foxglove
    description: Foxglove bridge — WebSocket on :8765 for inspecting the graph
    select: single
    alternatives:
      # Built and published by rammp-tools. On rammp-base like every
      # other node here: only a Cyclone participant with the fleet config can
      # see the fleet's topics, which is the whole point of a bridge.
      - id: foxglove_bridge_docker
        kind: docker
        container:
          image: ghcr.io/rammp-org/rammp-tools/foxglove:0.3.1
          network_mode: host
          ipc: host
          volumes:
            - ./config/robots/current/cyclonedds.xml:/etc/cyclonedds/robot.xml:ro
          environment:
            CYCLONEDDS_URI: file:///etc/cyclonedds/config.xml,file:///etc/cyclonedds/robot.xml
            ROS_DOMAIN_ID: "0"
          command: ros2 launch foxglove_bridge foxglove_bridge_launch.xml
        # No topics: it is a WebSocket server, reached at ws://<machine>:8765
        # from Foxglove (Open connection → Foxglove WebSocket). Camera-specific
        # services (orbbec_camera_msgs, realsense2_camera_msgs) are skipped
        # with a warning at startup — their type packages are not in the
        # image; every topic and every sensor_msgs service is bridged.
        publishes: []
        subscribes: []
      # No mock: nothing in the graph consumes it, so an unselected node costs
      # a workstation profile nothing.

  - name: arm
    description: Kinova Gen3 7-DoF on a 2F-85 gripper
    select: single
    alternatives:
      # Transcribed from kinova-gen3-ros2's rammp-alternative.yaml. That
      # fragment uses `compose:` against the module's own deploy/compose.yaml,
      # which builds images locally; inline here, per this file's convention.
      #
      # TWO CHANNELS OF ONE GENERATION. The release (kinova-gen3-ros2 2.1.0 with
      # RAMMP-CuRobo 2.0.2, no suffix) and `_nightly` (kinova-arm nightly
      # channel, rammp-org/rammp-nightly) both read the arm's model from
      # /arm/robot_description, rendered from the active robot's mount.yaml,
      # and take Cartesian goals in arm_mount, so a tilted mount (flatbot,
      # gen_1_5) moves and plans correctly. The nightly runs ahead of the
      # release, so still select one channel for arm, arm_state_publisher and
      # planner -- all three `_nightly`, or none. (Releases before 2.0.0 loaded
      # a level model from the image and cannot pair with either.)
      #
      # SELECT arm, arm_state_publisher AND planner TOGETHER. Three of the
      # driver's four action servers (go_to_ee_pose, go_to_joint_config,
      # go_to_preset) accept goals that can NEVER succeed without the planner,
      # and on the nightly the driver and planner both wait for the model
      # arm_state_publisher publishes. sheppy ignores depends_on, so the pairing
      # lives here.
      - id: kinova_gen3_driver
        kind: docker
        # Keys the params file sheppy writes, so the params below land on this
        # node rather than the /** wildcard. arbitration_mode is READ-ONLY at
        # launch, so a params file at startup is the only way it can be set.
        ros_node_name: kinova_gen3_node
        container:
          image: ghcr.io/rammp-org/kinova-gen3-ros2:2.1.0
          network_mode: host
          ipc: host
          # SYS_NICE permits sched_setscheduler; the ulimits are what let it
          # SUCCEED. Capabilities are not rlimits — `privileged: true` raises
          # the first and not the second, so it is NOT a substitute here.
          # (abra is RT-tuned with isolcpus=11 nohz_full=11 rcu_nocbs=11, which
          # no container contract can express — this only makes RT possible.)
          cap_add: [SYS_NICE]
          ulimits:
            rtprio: 99
            memlock: -1
          # No RMW_IMPLEMENTATION here: the image is built FROM rammp-base.
          # CYCLONEDDS_URI adds the robot's interface (see the top of this file).
          volumes:
            - ./config/robots/current/cyclonedds.xml:/etc/cyclonedds/robot.xml:ro
          environment:
            CYCLONEDDS_URI: file:///etc/cyclonedds/config.xml,file:///etc/cyclonedds/robot.xml
            ROS_DOMAIN_ID: "0"
          # Run as root: the RT loop needs the rlimits above.
          #
          # Paths are /module_ws, NOT the /ros2_ws the module's own
          # deploy/compose.yaml still says: rammp-base owns /ros2_ws (the
          # interface contract) and this node builds into /module_ws on top.
          #
          # --ip and --cpu are command-line flags, not ROS parameters: no
          # profile can override them (rammp-org/kinova-gen3-ros2#57). There is
          # no --urdf (the node refuses it): the model comes from
          # /arm/robot_description, and the node exits naming
          # arm_state_publisher if none arrives within 30 s.
          command:
            - /module_ws/install/kinova_gen3_ros2/lib/kinova_gen3_ros2/kinova_gen3_node
            - --ip
            - 192.168.1.10
            # Pins ONLY the 1 kHz RT loop to abra's isolated core, not the
            # whole container — --cpuset-cpus would drag the ROS threads onto
            # it too. Without --cpu the node sets no affinity at all.
            - --cpu
            - "11"
        params:
          arbitration_mode: disabled
          estop_clear_max_age_s: 1.0
          expect_gripper: true
        publishes:
          - /joint_states
          - /ee_state
          - /control_status
          - /stream_status
          - /gripper_state
          - /diagnostics
        subscribes:
          - /arm/robot_description
          - /estop
          - /setpoint/joint_position
          - /setpoint/joint_velocity
          - /setpoint/joint_torque
          - /setpoint/pose
          - /setpoint/twist
          - /setpoint/gripper
      # The nightly: as above, except the image and the pull.
      - id: kinova_gen3_driver_nightly
        kind: docker
        ros_node_name: kinova_gen3_node
        container:
          image: ghcr.io/rammp-org/kinova-gen3-ros2:nightly
          # `:nightly` moves to each green set; without a pull on every start
          # a robot keeps running whichever one it pulled first. If the pull
          # fails (robot offline, registry unreachable) it starts from the
          # cached image instead of failing. Pin a dated tag
          # (`:nightly-YYYYMMDD`) instead to hold a set still.
          pull_policy: prefer_latest
          network_mode: host
          ipc: host
          cap_add: [SYS_NICE]
          ulimits:
            rtprio: 99
            memlock: -1
          volumes:
            - ./config/robots/current/cyclonedds.xml:/etc/cyclonedds/robot.xml:ro
            - ./config/dds/cyclonedds-fleet.xml:/etc/cyclonedds/fleet.xml:ro
          environment:
            CYCLONEDDS_URI: file:///etc/cyclonedds/fleet.xml,file:///etc/cyclonedds/robot.xml
            ROS_DOMAIN_ID: "0"
          command:
            - /module_ws/install/kinova_gen3_ros2/lib/kinova_gen3_ros2/kinova_gen3_node
            - --ip
            - 192.168.1.10
            - --cpu
            - "11"
        params:
          arbitration_mode: disabled
          estop_clear_max_age_s: 1.0
          expect_gripper: true
          # enforce | observe | off (the driver's default is enforce). observe logs a contact and
          # never stops the arm: the microwave door pull trips the default thresholds, and the
          # daily demo runs every kitchen task on this arm. Read-only, so it changes only with a
          # restart. QUOTED: a bare `off` is YAML for false, and the node exits on a bool.
          contact_detection: "observe"
        publishes:
          - /joint_states
          - /ee_state
          - /control_status
          - /stream_status
          - /gripper_state
          - /diagnostics
        subscribes:
          - /arm/robot_description
          - /estop
          - /setpoint/joint_position
          - /setpoint/joint_velocity
          - /setpoint/joint_torque
          - /setpoint/pose
          - /setpoint/twist
          - /setpoint/gripper
      # The image also ships a --sim mode that is a real simulated arm, but it
      # is arm64-only, so it would not serve the "runs on a workstation" job
      # this mock exists for. Publish-only, as above.
      - id: arm_mock
        kind: process
        command: "bash -lc 'source /opt/ros/humble/setup.bash && ros2 topic pub -r 100 /joint_states sensor_msgs/msg/JointState \"{}\"'"
        publishes:
          - /joint_states

  - name: arm_state_publisher
    description: TF for the arm — robot_state_publisher on the arm's own model
    select: single
    alternatives:
      # The third container of the kinova-gen3-ros2 module, same image as the
      # driver: kinova_gen3_description is built into /module_ws, so the driver
      # and TF share one model by construction — the stated point of that
      # package. The driver itself publishes NO tf (only /joint_states); its
      # container is deliberately austere (root, SYS_NICE, rtprio, bare binary
      # as PID 1 on the isolated core), so TF runs here, separate, and bouncing
      # it never touches the 1 kHz loop. Same generation as `arm` (see there).
      #
      # The model is rendered at launch, rooted at arm_mount and rotated by the
      # active robot's mount.yaml (config/robots/current, set by
      # scripts/set_robot.py), and published latched on /arm/robot_description;
      # the driver and planner read it from there. Its joints carry the arm_
      # prefix. The driver publishes arm_robotiq_85_left_knuckle_joint and
      # robot_state_publisher derives the five mimic joints. Scoped to the arm
      # on purpose — a mobile base brings its own state publisher, and a static
      # mount transform stitches the trees.
      - id: kinova_gen3_description
        kind: docker
        container:
          image: ghcr.io/rammp-org/kinova-gen3-ros2:2.1.0
          network_mode: host
          ipc: host
          # No RMW_IMPLEMENTATION here: the image is built FROM rammp-base.
          # CYCLONEDDS_URI adds the robot's interface (see the top of this file).
          environment:
            CYCLONEDDS_URI: file:///etc/cyclonedds/config.xml,file:///etc/cyclonedds/robot.xml
            ROS_DOMAIN_ID: "0"
            HOME: /tmp
          # Unlike the driver, nothing here needs root — run as the host user,
          # like the cameras. The entrypoint sources /ros2_ws then /module_ws,
          # so `ros2 launch` resolves the description package.
          user: "1000:1000"
          # The active robot's config, relative to this manifest. A missing
          # `current` link makes Docker create an empty root-owned directory
          # here and the launch fails on the missing mount.yaml; run
          # scripts/set_robot.py, which tells you how to remove it.
          # The relative path resolves against this manifest only in sheppy at or
          # after #149 (df89566); older sheppy hands it to docker unchanged.
          volumes:
            - ./config/robots/current/cyclonedds.xml:/etc/cyclonedds/robot.xml:ro
            - ./config/robots/current:/config/robot:ro
          command: ros2 launch kinova_gen3_description description.launch.py mount_file:=/config/robot/mount.yaml
        publishes:
          - /arm/robot_description
          - /tf
          - /tf_static
        subscribes:
          - /joint_states
      # The nightly: as above, except the image and the pull.
      - id: kinova_gen3_description_nightly
        kind: docker
        container:
          image: ghcr.io/rammp-org/kinova-gen3-ros2:nightly
          pull_policy: prefer_latest  # see kinova_gen3_driver_nightly
          network_mode: host
          ipc: host
          environment:
            CYCLONEDDS_URI: file:///etc/cyclonedds/fleet.xml,file:///etc/cyclonedds/robot.xml
            ROS_DOMAIN_ID: "0"
            HOME: /tmp
          user: "1000:1000"
          volumes:
            - ./config/robots/current/cyclonedds.xml:/etc/cyclonedds/robot.xml:ro
            - ./config/dds/cyclonedds-fleet.xml:/etc/cyclonedds/fleet.xml:ro
            - ./config/robots/current:/config/robot:ro
          command: ros2 launch kinova_gen3_description description.launch.py mount_file:=/config/robot/mount.yaml
        publishes:
          - /arm/robot_description
          - /tf
          - /tf_static
        subscribes:
          - /joint_states
      # Wiring-only, like every mock here: /tf with no transforms in it. Needed
      # because the real alternative's image is arm64-only (same constraint as
      # the arm's --sim mode), so a workstation profile selects this.
      - id: arm_state_publisher_mock
        kind: process
        command: "bash -lc 'source /opt/ros/humble/setup.bash && ros2 topic pub -r 10 /tf tf2_msgs/msg/TFMessage \"{}\"'"
        publishes:
          - /tf

  - name: static_tf
    description: Fixed and calibrated transforms from the active robot's transforms/ on /tf_static
    select: single
    alternatives:
      # Every *.yaml in config/robots/<robot>/transforms/ (rammp-calibration's
      # mounts.yaml format), published once, latched. The image is rammp-tools'
      # generic static_tf; the robot-specific part is the data, mounted below.
      # Robot-specific geometry moves to the robot's URDF once one exists; what
      # stays here is what a calibration measures.
      - id: static_tf_docker
        kind: docker
        container:
          image: ghcr.io/rammp-org/rammp-tools/static_tf:0.3.1
          network_mode: host
          ipc: host
          # No RMW_IMPLEMENTATION here: the image is built FROM rammp-base.
          # CYCLONEDDS_URI adds the robot's interface (see the top of this file).
          environment:
            CYCLONEDDS_URI: file:///etc/cyclonedds/config.xml,file:///etc/cyclonedds/robot.xml
            ROS_DOMAIN_ID: "0"
            HOME: /tmp
          user: "1000:1000"
          # Same `current` link as arm_state_publisher: run scripts/set_robot.py
          # first. The image's default command reads /config/robot/transforms.
          volumes:
            - ./config/robots/current/cyclonedds.xml:/etc/cyclonedds/robot.xml:ro
            - ./config/robots/current:/config/robot:ro
        publishes:
          - /tf_static
      # Wiring-only: rammp-base is arm64-only, so a workstation profile selects this.
      - id: static_tf_mock
        kind: process
        command: "bash -lc 'source /opt/ros/humble/setup.bash && ros2 topic pub -r 1 /tf_static tf2_msgs/msg/TFMessage \"{}\"'"
        publishes:
          - /tf_static

  - name: planner
    description: cuRobo motion planner for the arm's go_to_* actions
    select: single
    alternatives:
      # Owned by rammp-org/RAMMP-CuRobo; declared here because sheppy cannot
      # express "and also start that one". Its own rammp-alternative.curobo.yaml
      # in kinova-gen3-ros2 says the same thing against a local build. Same
      # generation as `arm` (see there).
      #
      # Plans on the arm's own model from /arm/robot_description, in
      # arm_mount, and stamps every plan arm_mount. It exits 1 if no model
      # arrives within 30 s, and sheppy does not restart it: after fixing
      # arm_state_publisher, `sheppy restart planner`.
      #
      # The robot's planner config, world and robot file come from its own
      # config/robots/<robot>/curobo (dojo's is the bench). sheppy
      # appends --ros-args --params-file only AFTER a command -- with params
      # and no command it replaces the image CMD and the container exits 2 --
      # hence the explicit command.
      - id: curobo_planner
        kind: docker
        ros_node_name: rammp_curobo
        container:
          # 2.0.2: 2.0.0 plus the fleet's Cyclone DDS config in the image, with
          # no interface of its own, so the robot's file layers onto it.
          image: ghcr.io/rammp-org/rammp-curobo:2.0.2
          runtime: nvidia              # JetPack exposes the GPU this way, NOT --gpus
          network_mode: host
          ipc: host
          environment:
            CYCLONEDDS_URI: file:///etc/cyclonedds/config.xml,file:///etc/cyclonedds/robot.xml
            ROS_DOMAIN_ID: "0"
          # The first plan after a cold start compiles CUDA kernels — minutes,
          # during which go_to_* goals just sit there. The named volume keeps
          # them across restarts, so only the very first run pays.
          #
          # The active robot's config, as arm_state_publisher mounts it: a
          # robot whose planner sees per-robot obstacles (the chair) keeps them
          # in its curobo/ and its profile names them there. Its run needs
          # set_robot.py, as arm_state_publisher's does.
          volumes:
            - ./config/robots/current/cyclonedds.xml:/etc/cyclonedds/robot.xml:ro
            - curobo_kernel_cache:/root/.cache
            - ./config/robots/current:/config/robot:ro
          command:
            - /opt/rammp_curobo/rammp_curobo_ros/lib/rammp_curobo_ros/planner_node
        params:
          # Every robot carries curobo/ (its planner.yaml, robot.yaml,
          # world.yaml); nothing is read from the image. `world` must stay "":
          # a non-empty one replaces the world the config names.
          config: /config/robot/curobo/planner.yaml
          world: ""
        # Otherwise reached over the /rammp_curobo/plan_to_pose and
        # /rammp_curobo/plan_to_joints ACTIONS, which the schema has no way to
        # declare. The one topic is the arm's model, read once at startup.
        publishes: []
        subscribes:
          - /arm/robot_description
      # The nightly: as above, except the image and the pull.
      - id: curobo_planner_nightly
        kind: docker
        ros_node_name: rammp_curobo
        container:
          image: ghcr.io/rammp-org/rammp-curobo:nightly
          pull_policy: prefer_latest  # see kinova_gen3_driver_nightly
          runtime: nvidia
          network_mode: host
          ipc: host
          environment:
            CYCLONEDDS_URI: file:///etc/cyclonedds/fleet.xml,file:///etc/cyclonedds/robot.xml
            ROS_DOMAIN_ID: "0"
          volumes:
            - ./config/robots/current/cyclonedds.xml:/etc/cyclonedds/robot.xml:ro
            - ./config/dds/cyclonedds-fleet.xml:/etc/cyclonedds/fleet.xml:ro
            - curobo_kernel_cache:/root/.cache
            - ./config/robots/current:/config/robot:ro
          command:
            - /opt/rammp_curobo/rammp_curobo_ros/lib/rammp_curobo_ros/planner_node
        params:
          config: /config/robot/curobo/planner.yaml
          world: ""
        publishes: []
        subscribes:
          - /arm/robot_description
      # No mock. The mock convention here is "publish an empty message at the
      # right topic and type", and an action server has no topic to publish —
      # a mock would have to implement the action to be worth anything. Select
      # arm_mock and leave this node unselected instead.

  - name: arm_teleop
    description: Operator input (Xbox pad, Meta Quest 3 or SpaceMouse) -> the arm's streaming tier
    select: single
    alternatives:
      # Transcribed from rammp-org/rammp-teleop's rammp-alternative.{xbox,quest,spacemouse}.yaml,
      # pinned to its release. (Its quest-mock fragment is not carried here; the
      # mock convention in this file is arm_mock plus an unselected teleop.) Each alternative acquires
      # control of the arm and opens a stream, so the `arm` node must be
      # selected alongside; a profile that does not want teleop simply leaves
      # this node unselected. Nothing moves until the operator engages (stick
      # deflection on the pad, grip squeeze on the Quest).
      #
      # Xbox pad over USB: privileged + /dev:/dev so joy_node can open
      # /dev/input/js0. Streams base-frame twists (ee_twist).
      - id: xbox_pad
        kind: docker
        container:
          image: ghcr.io/rammp-org/rammp-teleop:0.3.1
          network_mode: host
          ipc: host
          privileged: true
          volumes:
            - ./config/robots/current/cyclonedds.xml:/etc/cyclonedds/robot.xml:ro
            - /dev:/dev
          environment:
            CYCLONEDDS_URI: file:///etc/cyclonedds/config.xml,file:///etc/cyclonedds/robot.xml
            ROS_DOMAIN_ID: "0"
          command: /module_ws/src/rammp-teleop/scripts/launch_entry.py rammp_teleop xbox.launch.py
        publishes:
          - /setpoint/twist
          - /setpoint/gripper
          - /estop
        subscribes:
          - /ee_state
          - /joint_states
          - /gripper_state
          - /stream_status
          - /control_status
      # Meta Quest 3 plugged into the Jetson over USB-C: quest_reader talks to
      # the headset over adb (needs /dev/bus/usb) and quest_teleop streams
      # clutched poses on ee_pose_impedance. ~/.android holds the adb key the
      # headset authorized ("Always allow from this computer"); without that
      # mount every container start re-prompts the headset. ~/.config/rammp_teleop
      # holds the controller->base calibration the operator redoes from the
      # controller (hold A) after each headset reboot, so it survives restarts.
      - id: quest3
        kind: docker
        container:
          image: ghcr.io/rammp-org/rammp-teleop:0.3.1
          network_mode: host
          ipc: host
          privileged: true
          volumes:
            - ./config/robots/current/cyclonedds.xml:/etc/cyclonedds/robot.xml:ro
            - /dev:/dev
            - /home/abra/.android:/root/.android
            - /home/abra/.config/rammp_teleop:/config
          environment:
            CYCLONEDDS_URI: file:///etc/cyclonedds/config.xml,file:///etc/cyclonedds/robot.xml
            ROS_DOMAIN_ID: "0"
          command: /module_ws/src/rammp-teleop/scripts/launch_entry.py rammp_teleop quest.launch.py r_align_file:=/config/quest_r_align.json
        publishes:
          - /setpoint/pose
          - /setpoint/gripper
          - /estop
          - /quest/right/pose
          - /quest/joy
        subscribes:
          - /ee_state
          - /joint_states
          - /gripper_state
          - /stream_status
          - /control_status
      # 3Dconnexion SpaceMouse: spacenav_node reads the puck through the host's
      # spacenavd service (its socket is mounted; no /dev access needed) and
      # space_teleop streams base-frame twists (ee_twist), all six axes at once.
      # Left/right button close/open the gripper; there is no e-stop button.
      - id: spacemouse
        kind: docker
        container:
          image: ghcr.io/rammp-org/rammp-teleop:0.3.1
          network_mode: host
          ipc: host
          volumes:
            - ./config/robots/current/cyclonedds.xml:/etc/cyclonedds/robot.xml:ro
            - /var/run/spnav.sock:/var/run/spnav.sock
          environment:
            CYCLONEDDS_URI: file:///etc/cyclonedds/config.xml,file:///etc/cyclonedds/robot.xml
            ROS_DOMAIN_ID: "0"
          command: /module_ws/src/rammp-teleop/scripts/launch_entry.py rammp_teleop space_mouse.launch.py
        publishes:
          - /setpoint/twist
          - /setpoint/gripper
          - /spacenav/joy
        subscribes:
          - /ee_state
          - /joint_states
          - /gripper_state
          - /stream_status
          - /control_status

  - name: scene_segmenter
    description: Always-on object segmentation of the scene camera -> /perception/object_detections
    select: single
    alternatives:
      # Transcribed from rammp-org/rammp-perception's rammp-alternative.{yoloe-gpu,yoloe-dla,rfdetr,
      # scene-segmenter-mock}.yaml. Every alternative publishes the same message
      # (rammp_perception_interfaces/ObjectDetections) on the same topic with the same class names
      # (food container, drink cup, fridge, microwave, table), so consumers -- the Orchestrator first --
      # do not care which one is selected. Objects keep their instance_id ("microwave_2") while tracked.
      #
      # NOT A RELEASE: rammp-perception has not cut one yet (it waits on rammp-interfaces-ros2's next
      # tag). These pin the immutable sha-<commit> images CI published from its dev branch; replace with
      # the first release tag. Every perception image here must come from the same build: since
      # rammp-interfaces-ros2#16 (DetectedObject.size) the message's wire format changed, and a node
      # built against the old definition silently misreads messages from one built against the new.
      #
      # YOLOE-26m on the GPU: the best YOLOE masks (and the best open-vocabulary quality score, #106):
      # 10 Hz, ~100 ms camera to result, ~10% GPU on abra next to SAM3 and the planner. Not the always-on
      # segmenter; RF-DETR is (below). The first start builds a TensorRT engine into the volume (about 9
      # minutes); later starts reuse it.
      - id: yoloe_gpu
        kind: docker
        container:
          image: ghcr.io/rammp-org/rammp-perception/yoloe:sha-d393a0fb400e319cab1edf4666c91d1533dd1b24
          runtime: nvidia
          network_mode: host
          ipc: host
          user: "1000:1000"
          volumes:
            - ./config/robots/current/cyclonedds.xml:/etc/cyclonedds/robot.xml:ro
            - rammp_perception_engines:/cache/engines
          environment:
            CYCLONEDDS_URI: file:///etc/cyclonedds/config.xml,file:///etc/cyclonedds/robot.xml
            ROS_DOMAIN_ID: "0"
            HOME: /tmp
        params:
          model: yoloe-26m-seg
          device: gpu
          image_topic: /scene_camera/color/image_raw
          frame_stride: 3            # every 3rd camera frame: 10 Hz from the 30 fps scene camera
        publishes:
          - /perception/object_detections
          - /perception/scene_segmenter/overlay/compressed
        subscribes:
          - /scene_camera/color/image_raw
      # YOLOE-26s on DLA core 0: frees most of the GPU, but 94 ms per frame on the DLA does not hold
      # 10 Hz in the stack (9.3 Hz; 7.7 Hz with BoxerNet; 7.2 Hz next to a busy GPU, since the
      # detection head falls back to the GPU). First start builds its engine (about 2 minutes).
      - id: yoloe_dla
        kind: docker
        container:
          image: ghcr.io/rammp-org/rammp-perception/yoloe:sha-d393a0fb400e319cab1edf4666c91d1533dd1b24
          runtime: nvidia
          network_mode: host
          ipc: host
          user: "1000:1000"
          volumes:
            - ./config/robots/current/cyclonedds.xml:/etc/cyclonedds/robot.xml:ro
            - rammp_perception_engines:/cache/engines
          environment:
            CYCLONEDDS_URI: file:///etc/cyclonedds/config.xml,file:///etc/cyclonedds/robot.xml
            ROS_DOMAIN_ID: "0"
            HOME: /tmp
        params:
          model: yoloe-26s-seg
          device: dla0
          image_topic: /scene_camera/color/image_raw
          frame_stride: 3
          # BoT-SORT camera-motion compensation costs ~14 ms of CPU per frame (8.4 instead of 9.5 Hz).
          # Turn it back on (sparseOptFlow) if ids break while the chair moves.
          gmc_method: none
        publishes:
          - /perception/object_detections
          - /perception/scene_segmenter/overlay/compressed
        subscribes:
          - /scene_camera/color/image_raw
      # RF-DETR-Seg S, COCO weights, on the GPU: the always-on segmenter (#106). Cleanest masks, but COCO
      # classes only: "food container" is found only when it looks like a bowl, and #106's quality check
      # scores it below YOLOE-26m (mAP 0.68 vs 0.86 on Gemini and handheld images), the accepted tradeoff.
      # frame_stride 3 is 5 Hz from flatbot's 15 fps OAKs (10 Hz from the dojo's 30 fps Gemini). On snorlax
      # at 5 Hz: ~75 ms camera to result (~40 ms of it in the node), ~7% GPU, 0.2 CPU core; at 15 Hz
      # (stride 1), ~20% GPU, 0.5 core. On abra at 10 Hz: ~100 ms, ~18% GPU.
      - id: rfdetr
        kind: docker
        container:
          image: ghcr.io/rammp-org/rammp-perception/rfdetr:sha-d393a0fb400e319cab1edf4666c91d1533dd1b24
          runtime: nvidia
          network_mode: host
          ipc: host
          user: "1000:1000"
          volumes:
            - ./config/robots/current/cyclonedds.xml:/etc/cyclonedds/robot.xml:ro
          environment:
            CYCLONEDDS_URI: file:///etc/cyclonedds/config.xml,file:///etc/cyclonedds/robot.xml
            ROS_DOMAIN_ID: "0"
            HOME: /tmp
        params:
          model: small
          image_topic: /scene_camera/color/image_raw
          frame_stride: 3
        publishes:
          - /perception/object_detections
          - /perception/scene_segmenter/overlay/compressed
        subscribes:
          - /scene_camera/color/image_raw
      # RF-DETR as above, feeding object_tracker's odom3d instead of the Orchestrator: thresholds of 0.10 and
      # tv as fridge evidence (classes_tracking.yaml), no tracker of its own, and published on
      # /perception/object_detections_raw. odom3d publishes /perception/object_detections, so select the two
      # together. NOT A RELEASE pin, as above: dd9da01 is the first build carrying classes_tracking.yaml
      # (rammp-perception#20), with the same interfaces (v2.1.0) as d393a0f.
      - id: rfdetr_tracking
        kind: docker
        container:
          image: ghcr.io/rammp-org/rammp-perception/rfdetr:sha-dd9da01134c598876f7bd8b6ac019d736fb1d62e
          runtime: nvidia
          network_mode: host
          ipc: host
          user: "1000:1000"
          volumes:
            - ./config/robots/current/cyclonedds.xml:/etc/cyclonedds/robot.xml:ro
          environment:
            CYCLONEDDS_URI: file:///etc/cyclonedds/config.xml,file:///etc/cyclonedds/robot.xml
            ROS_DOMAIN_ID: "0"
            HOME: /tmp
          command: [--ros-args, -r, /perception/object_detections:=/perception/object_detections_raw]
        params:
          model: small
          image_topic: /scene_camera/color/image_raw
          frame_stride: 3
          classes_file: /etc/rammp/perception/classes_tracking.yaml
          tracking: false
        publishes:
          - /perception/object_detections_raw
          - /perception/scene_segmenter/overlay/compressed
        subscribes:
          - /scene_camera/color/image_raw
      # Same topic and type, no model, no GPU, no camera: empty detections at 10 Hz.
      - id: scene_segmenter_mock
        kind: docker
        container:
          image: ghcr.io/rammp-org/rammp-perception/yoloe:sha-d393a0fb400e319cab1edf4666c91d1533dd1b24
          network_mode: host
          ipc: host
          user: "1000:1000"
          volumes:
            - ./config/robots/current/cyclonedds.xml:/etc/cyclonedds/robot.xml:ro
          environment:
            CYCLONEDDS_URI: file:///etc/cyclonedds/config.xml,file:///etc/cyclonedds/robot.xml
            ROS_DOMAIN_ID: "0"
            HOME: /tmp
        params:
          mock: true
        publishes:
          - /perception/object_detections

  - name: sam3
    description: SAM3 on-demand expert detection and tracking sessions under /perception/sam3
    select: single
    alternatives:
      # Transcribed from rammp-org/rammp-perception's rammp-alternative.sam3.yaml; NOT A RELEASE pin, as
      # for scene_segmenter above. 35bc09c is d393a0f plus the baked-in weights (rammp-perception#5): same
      # interfaces, so it pairs with the other perception images' d393a0f. Services
      # /perception/sam3/{detect,start_tracking,stop_tracking,renew_tracking}; a session streams
      # ObjectDetections on /perception/sam3/object_detections and runs until stopped (leases are off).
      # Detect ~0.4-0.9 s; tracking ~12 Hz for one object.
      #
      # The facebook/sam3 weights are in the image, so the package is private (the SAM License limits
      # redistribution): the host needs a `docker login ghcr.io` to pull it (README.md). TensorRT
      # encoders are built once per machine into the sam3_engines volume (README.md, or
      # object_detection/sam3/sam3.yaml in rammp-perception); without them the node falls back to
      # PyTorch, slower with the same output.
      - id: sam3_docker
        kind: docker
        container:
          image: ghcr.io/rammp-org/rammp-perception/sam3:sha-35bc09c00aced70fbaf8fc8bccd164b07ffe546d
          runtime: nvidia
          network_mode: host
          ipc: host
          user: "1000:1000"
          volumes:
            - ./config/robots/current/cyclonedds.xml:/etc/cyclonedds/robot.xml:ro
            - sam3_engines:/cache/engines
          environment:
            CYCLONEDDS_URI: file:///etc/cyclonedds/config.xml,file:///etc/cyclonedds/robot.xml
            ROS_DOMAIN_ID: "0"
            HOME: /tmp
        params:
          # Tracking at 5 Hz takes ~22% of the GPU instead of ~60% uncapped (~13 Hz on snorlax, ~48% at
          # ~12 Hz on abra), leaving it to the rest of the chair (#106). A capped step tracks the
          # first frame after it is due (rammp-perception#8, #17): ~110 ms camera to result, not ~270 ms.
          max_tracking_rate_hz: 5.0
        publishes:
          - /perception/sam3/object_detections
          - /perception/sam3/status
        subscribes:
          - /scene_camera/color/image_raw
      # No mock, as for the planner: SAM3 is reached through services, and a mock would have to
      # implement them to be worth anything. Leave this node unselected on a workstation.

  - name: object_tracker
    description: Stable ids and 3D boxes for the scene segmenter's objects, at camera rate -> /perception/object_detections
    select: single
    alternatives:
      # Transcribed from rammp-org/rammp-perception's rammp-alternative.odom3d.yaml; NOT A RELEASE pin, the
      # same build as scene_segmenter's rfdetr_tracking, which it must run with: that publishes
      # /perception/object_detections_raw, and this publishes /perception/object_detections. Each object is
      # tracked where it is in odom and re-projected into every camera frame from wheel odometry, so ids stay
      # put while the chair turns and an object that leaves view gets its old id back. CPU only, ~4 ms per
      # detection, <1 ms per frame. Known problems to tune: rammp-perception#24.
      #
      # Output differs from the segmenter's: one message per camera frame; has_pose true, pose and size a
      # gravity-aligned 3D box in the camera's optical frame; no masks (mask_id 0, label_image empty).
      #
      # Needs depth registered to color, and TF odom <- camera at image stamps. camera_extrinsic [0.0] takes
      # the camera from TF; [x, y, z, qx, qy, qz, qw] of the optical frame in base_frame replaces
      # base_frame -> camera when the tree has no such link.
      #
      # Diverges from the fragment: the Cyclone config, as for the other perception nodes, and the node's own
      # defaults for depth_topic (the Gemini's, as for object_lifter) and camera_extrinsic; the fragment's
      # flatbot values are not used (profiles/flatbot.yaml).
      - id: odom3d
        kind: docker
        container:
          image: ghcr.io/rammp-org/rammp-perception/odom3d:sha-dd9da01134c598876f7bd8b6ac019d736fb1d62e
          network_mode: host
          ipc: host
          user: "1000:1000"
          volumes:
            - ./config/robots/current/cyclonedds.xml:/etc/cyclonedds/robot.xml:ro
          environment:
            CYCLONEDDS_URI: file:///etc/cyclonedds/config.xml,file:///etc/cyclonedds/robot.xml
            ROS_DOMAIN_ID: "0"
            HOME: /tmp
        params:
          detections_topic: /perception/object_detections_raw
          depth_topic: /scene_camera/depth/image_raw
          camera_info_topic: /scene_camera/color/camera_info
          output_topic: /perception/object_detections
          odom_frame: odom
          base_frame: base_link
          camera_extrinsic: [0.0]
          depth_slop_s: 0.02           # how far in time a depth frame may be from a detection
          publish_out_of_view: false
        publishes:
          - /perception/object_detections
          - /perception/odom3d/markers
        subscribes:
          - /perception/object_detections_raw
          - /scene_camera/depth/image_raw
          - /scene_camera/color/camera_info
          - /tf
          - /tf_static
      # No mock: on a workstation, scene_segmenter_mock publishes /perception/object_detections itself, so
      # leave this node unselected.

  - name: object_lifter
    description: 3D boxes (pose + size) for the scene segmenter's objects -> /perception/object_detections_3d
    select: single
    alternatives:
      # Transcribed from rammp-org/rammp-perception's rammp-alternative.boxer.yaml. NOT A RELEASE pin, the
      # same build as scene_segmenter above. BoxerNet lifts every object of /perception/object_detections to a
      # gravity-aligned 3D box and republishes the message on /perception/object_detections_3d with
      # pose (in the camera's optical frame) and size filled in. ~90 ms per frame on abra, keeping up with
      # the segmenter. First start builds its TensorRT engines into the volume (about 2.5 minutes).
      #
      # Needs, per frame: the Gemini's registered depth (scene_camera above) and TF from gravity_frame to
      # the camera. static_tf attaches the camera from the active robot's transforms/ (on flatbot,
      # arm_mount -> scene_camera, so gravity_frame is arm_mount there); without it, every object comes out with has_pose false and the node logs the
      # missing transform. The OAK scene camera's depth is /scene_camera/depth/image_rect_raw, synced
      # to color on the device, so depth_slop_s can be tight there (profiles/flatbot.yaml sets all three).
      # BoxerNet's weights are CC-BY-NC 4.0 (non-commercial) and baked into the image.
      - id: boxer
        kind: docker
        container:
          image: ghcr.io/rammp-org/rammp-perception/boxer:sha-d393a0fb400e319cab1edf4666c91d1533dd1b24
          runtime: nvidia
          network_mode: host
          ipc: host
          user: "1000:1000"
          volumes:
            - ./config/robots/current/cyclonedds.xml:/etc/cyclonedds/robot.xml:ro
            - rammp_perception_engines:/cache/engines
          environment:
            CYCLONEDDS_URI: file:///etc/cyclonedds/config.xml,file:///etc/cyclonedds/robot.xml
            ROS_DOMAIN_ID: "0"
            HOME: /tmp
        params:
          detections_topic: /perception/object_detections
          image_topic: /scene_camera/color/image_raw
          depth_topic: /scene_camera/depth/image_raw
          camera_info_topic: /scene_camera/color/camera_info
          gravity_frame: base_link     # any frame with +z up; only its rotation is used
          min_prob: 0.5
          depth_slop_s: 0.02           # how far in time a depth frame may be from its color frame
          frame_stride: 1              # lift every Nth detections message; stacks on the detector's own stride
        publishes:
          - /perception/object_detections_3d
        subscribes:
          - /perception/object_detections
          - /scene_camera/color/image_raw
          - /scene_camera/depth/image_raw
          - /scene_camera/color/camera_info
          - /tf
          - /tf_static
      # Diverges from the fragments: boxer has no mock mode, so this is the scene segmenter's mock (same
      # image, same message) renamed and remapped onto object_lifter's topic. Empty detections at 10 Hz.
      - id: object_lifter_mock
        kind: docker
        container:
          image: ghcr.io/rammp-org/rammp-perception/yoloe:sha-d393a0fb400e319cab1edf4666c91d1533dd1b24
          network_mode: host
          ipc: host
          user: "1000:1000"
          volumes:
            - ./config/robots/current/cyclonedds.xml:/etc/cyclonedds/robot.xml:ro
          environment:
            CYCLONEDDS_URI: file:///etc/cyclonedds/config.xml,file:///etc/cyclonedds/robot.xml
            ROS_DOMAIN_ID: "0"
            HOME: /tmp
          command: [--ros-args, -r, __node:=boxer, -r, /perception/object_detections:=/perception/object_detections_3d]
        params:
          mock: true
        publishes:
          - /perception/object_detections_3d

  - name: feeding
    description: Robot-assisted feeding -- a capability engine the orchestrator drives, one bite per action
    select: single
    alternatives:
      # Transcribed from rammp-feeding's rammp-alternative.yaml (v0.6.3, debajyotidasgupta/rammp-feeding) for the 2.0
      # arm generation. A release pin: the module publishes version tags only, so a PR moves the pin when it releases.
      # Diverges from the fragment: the fleet DDS config and robot interface file (as every docker node here), the
      # image's registry spelled out, and NO planner mount. The fragment has both planners mount
      # /srv/rammp_feeding/config at /feeding because it hands cuRobo its world as a file path; the shared planner is
      # not changed for one module, so its set_world fails until the module hands worlds over another way.
      #
      # Attended only, and only on a robot set up per rammp-feeding's docs/porting.md: its site file, captured poses
      # and calibrations in the host's /srv/rammp_feeding/config (owned by uid 1000), which drinking shares.
      # Transcribed from the feeding module's rammp-alternative.yaml. A capability engine (rammp-kitchen-capability-
      # engines' CapabilityEngine, engine id `feeding`): it registers with the orchestrator and moves the arm only in an
      # action the orchestrator starts (start_meal, feed, finish_meal; with a stand, pick_up_fork and put_down_fork;
      # docs/interface.md). It moves the arm only through
      # the arm node (execute_joint_trajectory: its own IK paths and the planner's paths), so `arm`,
      # `arm_state_publisher` and `planner` must be selected alongside, with `wrist_camera`, `scene_camera` and `sam3`.
      # Stopping it cancels the action in flight: the move stops and the arm settles. It commands the gripper only in the
      # two fork actions (/setpoint/gripper, with the action's token).
      # It uses the shared planner as configured for everyone: its own world goes in only while an action plans, and the
      # planner's comes back as the action ends.
      - id: rammp_feeding_docker
        kind: docker
        container:
          image: docker.io/debajyotidasgupta/rammp-feeding:0.6.3     # Docker Hub, arm64
          network_mode: host
          ipc: host
          user: "1000:1000"
          # State across runs (patterns/storing-state-across-runs): local.yaml, the captured poses, the wrist camera's
          # measured mount, the scene camera's measured pose and latest reading, the world it hands the planner. The run
          # record beside it (only with `record` on).
          volumes:
            # The fleet's DDS config and this robot's interface file, as every docker node here.
            - ./config/robots/current/cyclonedds.xml:/etc/cyclonedds/robot.xml:ro
            - ./config/dds/cyclonedds-fleet.xml:/etc/cyclonedds/fleet.xml:ro
            - /srv/rammp_feeding/config:/config     # the host's folders, owned by uid 1000 (docs/porting.md)
            - /srv/rammp_feeding/runs:/runs
          environment:
            CYCLONEDDS_URI: file:///etc/cyclonedds/fleet.xml,file:///etc/cyclonedds/robot.xml
            ROS_DOMAIN_ID: "0"
            HOME: /tmp
          # The node's executable (sheppy appends --ros-args --params-file with the params below)
          command: ["/module_ws/install/rammp_feeding/lib/rammp_feeding/feeding_node"]
        # Per robot, overridable from a profile (docs/interface.md, Parameters). The defaults are the December demo
        # robot's cameras (OAK-D Pro on the wrist, OAK-D Pro W on the scene).
        params:
          use_orchestrator: true
          state_dir: /config
          runs_dir: /runs
          record: false                       # the run record: a debug setting, off
          camera_profile: oak_d_pro
          scene_camera_profile: oak_d_pro_w
          config: ""                          # any other setting, "a.b=1,c=[1, 2]"
        # (the cameras' topics: the selected camera profiles', config/camera/*.yaml; these are the defaults')
        subscribes:
          - /arm/robot_description
          - /joint_states
          - /control_status
          - /tf
          - /tf_static
          - /wrist_camera/color/image_raw
          - /wrist_camera/color/camera_info
          - /wrist_camera/depth/image_rect_raw
          - /scene_camera/color/image_raw
          - /scene_camera/color/camera_info
          - /scene_camera/depth/image_rect_raw
          - /gripper_state
        publishes:
          - /feeding/status
          - /tf_static
          - /reset
          - /setpoint/gripper
      # The real alternative's interface with no hardware: the same node with mock:=true (it registers and answers
      # every action at once; nothing moves).
      - id: feeding_mock
        kind: docker
        container:
          image: docker.io/debajyotidasgupta/rammp-feeding:0.6.3
          network_mode: host
          ipc: host
          volumes:
            # The fleet's DDS config and this robot's interface file, as every docker node here.
            - ./config/robots/current/cyclonedds.xml:/etc/cyclonedds/robot.xml:ro
            - ./config/dds/cyclonedds-fleet.xml:/etc/cyclonedds/fleet.xml:ro
          environment:
            CYCLONEDDS_URI: file:///etc/cyclonedds/fleet.xml,file:///etc/cyclonedds/robot.xml
            ROS_DOMAIN_ID: "0"
            HOME: /tmp
          command: ["ros2", "launch", "rammp_feeding", "feeding.launch.py", "mock:=true"]
        subscribes:
          - /arm/robot_description
          - /joint_states
          - /control_status
          - /tf
          - /tf_static
          - /wrist_camera/color/image_raw
          - /wrist_camera/color/camera_info
          - /wrist_camera/depth/image_rect_raw
          - /scene_camera/color/image_raw
          - /scene_camera/color/camera_info
          - /scene_camera/depth/image_rect_raw
          - /gripper_state
        publishes:
          - /feeding/status
          - /tf_static
          - /reset
          - /setpoint/gripper

  - name: drinking
    description: Robot-assisted drinking -- a capability engine the orchestrator drives, one sip per action
    select: single
    alternatives:
      # Transcribed from rammp-drinking's rammp-alternative.yaml (v0.1.4, debajyotidasgupta/rammp-drinking), on
      # rammp-feeding 0.6.3's image. A release pin, as feeding's. Diverges from the fragment as feeding does (fleet DDS,
      # registry spelled out, no planner mount: its drink_world.yaml goes to the planner by file path, so set_world
      # fails until the module changes that). Shares feeding's /srv/rammp_feeding state: one site file, one wrist
      # camera mount, one home pose. Attended only.
      # Transcribed from the drinking module's rammp-alternative.yaml. A capability engine (rammp-kitchen-capability-
      # engines' CapabilityEngine, engine id `drinking`): it registers with the orchestrator and moves the arm only in an
      # action the orchestrator starts (pick_up_drink, give_sip, put_down_drink; docs/interface.md). It moves the arm only
      # through the arm node (execute_joint_trajectory: its own IK paths and the planner's, HOLD_LEVEL while it carries the
      # cup) and commands the gripper (/setpoint/gripper: it holds the cup's handle from inside), so `arm`,
      # `arm_state_publisher` and `planner` must be selected alongside, with `wrist_camera` and `sam3`. The gripper must be
      # empty for drinking: the fork put back on its stand (feeding's put_down_fork) or taken out by hand. Stopping it
      # cancels the action in flight: the move stops and the arm settles. It uses the shared planner as configured for
      # everyone: its own world goes in only while an action plans, and the planner's own comes back as the action ends.
      - id: rammp_drinking_docker
        kind: docker
        container:
          image: docker.io/debajyotidasgupta/rammp-drinking:0.1.4     # Docker Hub, arm64 (on rammp-feeding 0.6.3's image)
          network_mode: host
          ipc: host
          user: "1000:1000"
          # The state shared with rammp-feeding (patterns/storing-state-across-runs): the site file, the wrist camera's
          # mount, the arm poses (drink_gaze, drink_hold, drink_deliver beside feeding's), the cup this session
          # (drink_state.json), the world it hands the planner; the run record beside it (only with `record` on).
          volumes:
