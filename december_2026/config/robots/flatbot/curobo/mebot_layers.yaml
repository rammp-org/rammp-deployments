# flatbot's chair measurements: the input of RAMMP-CuRobo's
# scripts/generate_layers.py, copied from its scripts/mebot_layers.yaml (the
# values of RAMMP-CuRobo PR #46: seat, fitted person, arm at y 0.36).
# They are BEST GUESSES, not measured on flatbot; measure them and edit here.
# keep_out.robot_config names flatbot's own robot.yaml, next to this file.
#
# Regenerate the layer_mebot_*.yaml next to this file, from a RAMMP-CuRobo
# checkout (the generator is deterministic; never hand-edit the layers):
#
#   make layers DATA=<this file> OUTDIR=<this directory>
#
# Inputs of scripts/generate_layers.py: the MEBot obstacle layers.
#
# Every number in core/tests/data/mebot/layer_mebot_{platform,person,floor}.yaml
# comes from this file, or from the URDF and the robot config it names. Edit
# here and run `make layers`; the layer files themselves are never hand-edited.
#
# Metres unless a key says otherwise. The "mebot frame" is the root link of
# the pinned URDF (x forward, y left, z up). The layers are written in
# arm_mount, the root of the arm's own URDF, which the planner plans in.
# arm_mount -> arm_base_link (arm_base_joint) is a rotation only, so
# `arm_base_in_mebot` below places arm_mount too; arm_mount stays square to
# the chair, and `arm_base_joint` tilts the arm on it.

# The MEBot drive base: the RAMMP Gen1.2 URDF (available in Demo-Software),
# https://github.com/rammp-org/Demo-Software/blob/80908b9f73f02e094106c0b82640a23c3cd6f41c/core/rammp_prototype_description/urdf/rammp_prototype_base.urdf
# It is fetched by commit and checked by sha256 (cache, a local Demo-Software
# clone, then GitHub raw); no copy lives here.
# TODO: everything below is Gen1.2 measurements — repin to the Gen1.5 URDF and
# update the parameters to the Gen1.5 specs, then `make layers`.
source:
  repo: rammp-org/Demo-Software
  # The commit that added the file on origin/dev (= origin/HEAD).
  commit: 80908b9f73f02e094106c0b82640a23c3cd6f41c
  path: core/rammp_prototype_description/urdf/rammp_prototype_base.urdf
  # Of the raw bytes (the file is CRLF): `git show <commit>:<path> | sha256sum`.
  sha256: 201ec24aeeff868557b13211eaa4571b8f11cd6709795537098bafaef032c0ec
  # Provenance only: the same blob at the commits a reviewer might look for.
  git_blob: 8f571f54
  same_blob_at:
    - 59d5aef (authoring commit; only on origin/feature/106-drive-base-publisher)
    - 0a94cce (origin/main, Release 1.0)

# Where the arm sits on the drive base, MEASURED on flatbot (2026-11-05, seat
# at its lowest; the arm rises with the seat, so the floor and base only drop
# away from it). A non-zero rpy_deg is refused: the boxes are axis-aligned in
# arm_mount. The arm is on the chair's LEFT, the joystick on its right.
#   x: the arm-side drive wheel's hub is 6.5 in ahead of the arm's base.
#   y: the base is centred on the seat: the seat's centreline is 13.81 in to
#      the arm's right (the occupant band below); drive hubs 23.5 in apart,
#      the URDF's 23.95.
#   z: the ground is 20.5 in below the arm's base (19 in to the plate's
#      bottom, plus the plate's 1.75 in from new_adapter_plate_v3), so the
#      URDF's lowest point is put there.
# The person and seat below are measured from the arm's base (boxes_in), so
# a change here moves only the drive base and the floor.
mount:
  arm_base_in_mebot: {position: [0.3207, 0.3508, 0.4374], rpy_deg: [0, 0, 0]}
  # The arm's tilt on arm_mount: arm_base_link's rotation in it, as
  # rammp-deployments config/robots/flatbot/mount.yaml states it (the
  # new_adapter_plate_v3, 30 degrees forward). It places the arm's fixed
  # spheres, which the person is carved around and the platform's merges
  # clear; the boxes themselves stay square to the chair.
  arm_base_joint: {rpy_deg: [0, 30, 0]}
  # Provenance only. The RAMMS BP_Mebot_Ramms blueprint chain (on the right
  # rail, so y mirrored above); the mount uses its sum with z rounded to 0.376.
  chain:
    seat_base: [0.345, 0, 0.256381]
    rail_r: [0.020, -0.265, 0.085]
    mount_arm: [0.140, 0, 0.020]
    ArmSkMesh: [0, 0, 0.015]
    sum: [0.505, -0.265, 0.376381]
  # The RAMMS BP_Mebot_Mujoco blueprint puts the arm at the mount_arm origin,
  # without ArmSkMesh's +0.015.
  alt_chain:
    arm: [0.505, -0.265, 0.361381]
  # Demo-Software's own TF. It matches the chain in x/y (to 1e-6) only in the
  # UE VehicleMesh component frame, whose root bone is at
  # (-0.538656, 0.002557, 0.028235); applied to this URDF as it stands it would
  # put the arm 0.539 m further back. Its +1.15 cm in z is unexplained.
  not_used:
    demo_software_tf: [-0.033657, -0.262443, 0.416116]
    in_urdf_frame: [0.505, -0.265, 0.388]

# Everything after one outward snap is integer ticks of this grid.
grid_m: 0.0001
# The layers are sized for this much planner padding per side; it must equal
# the chair config's world_padding.
padding_assumed_m: 0.02
# How far a padded box stays from the arm's fixed spheres when the generator
# has the choice: merges that come closer are skipped, and the person is
# carved back by this much.
keep_out_margin_m: 0.005

# The arm's joint-independent collision spheres: arm_base_link's, and
# arm_shoulder_link's, which sit on the arm_joint_1 axis. A padded box touching
# them makes every state a collision. This keep-out places them for a level
# mount (arm_base_joint the identity); the planner's FK-based guard checks
# every layer box against the column of the live mount, tilted or not.
keep_out:
  # The robot file the spheres and collision_sphere_buffer are read from: a
  # name resolves next to THIS file, `example:<name>` is the image's example.
  robot_config: robot.yaml
  # arm_joint_1's origin, which places arm_shoulder_link in arm_base_link
  # (cuRobo v0.7.8, kinova_gen3_7dof.urdf:55; the same in the arm's URDF).
  # The key keeps its pre-#38 name.
  shoulder_link_origin: {xyz: [0, 0, 0.15643], rpy: [3.1416, 0, 0]}
  # The gate: a layer whose padded boxes come closer than this is not written.
  min_clearance_m: 0.004

platform:
  max_boxes: 16       # of the planner's 60-box cache
  max_over_pct: 15.0  # volume merging adds, against the primitives' bounding boxes

# The occupant, MEASURED (2026-11-05) as a cardboard side profile, clearance
# included, so no margin is added. Inches in arm_mount (x forward, y left,
# z up) from the arm's base. Its front, top to bottom: A (0, 43) head top,
# K (0, 12.5) chest/head front to the thigh top, J (13, 12.5) thigh top,
# I (25, 3) knee cut, H (25, -20.5) shins to the ground. 19 in wide in y, its
# near side 2.5 in from the side of the arm's base (radius 1.81 in). Its back
# is the backrest's face (unmeasured: the arm does not plan behind it). The
# knee cut J-I is three steps that enclose it. flatbot's own body is inside
# this volume.
person:
  boxes_in:
    torso: [[-9.12, -23.31, 12.5], [0, -4.31, 43]]
    lap: [[-9.12, -23.31, 9.34], [17, -4.31, 12.5]]
    knees: [[-9.12, -23.31, 6.17], [21, -4.31, 9.34]]
    legs: [[-9.12, -23.31, -20.5], [25, -4.31, 6.17]]

# The chair's seat, in inches in arm_mount, as the person.
seat:
  # The seat is carved further from the arm's fixed spheres than the person
  # (keep_out_margin_m): it surrounds the arm's base, and closer than the
  # planner's collision_activation_distance (0.03) those spheres carry a
  # collision cost no joint can lower, under which cuRobo's trajectory
  # optimisation finds only paths slower than its largest dt (DT_EXCEPTION),
  # on nearly every plan.
  keep_out_margin_m: 0.035
  # Carved by a cube around each fixed sphere, not one box around them all:
  # with the arm tilted 30 degrees that box covers the armrest's whole height
  # over the arm, and would drop its front 15 cm.
  carve: spheres
  boxes_in:
    # MEASURED: 15.5 x 4 x 2 in, its front 2 in ahead of the arm's base, its
    # bottom 33.5 in off the ground, straight above the arm. The generator
    # trims its front underside where it comes within 35 mm of the shoulder.
    armrest_arm: [[-13.5, -2.5, 13], [2, 1.5, 15]]
    # MEASURED: the arm-side armrest mirrored about the seat's centreline.
    armrest_far: [[-13.5, -29.12, 13], [2, -25.12, 15]]
    # The joystick: "Joystick Assembly v1.4" (a STEP from the
    # mechanical team, 2026-11-05), its RJ45 cable left out. Its CAD +x is the
    # chair's forward and +y up; on the far armrest's centreline, its back 2 in
    # ahead of the armrest's front and its flat bottom level with the
    # armrest's (owner, 2026-11-05). Six boxes along its length, each the
    # bounds of its surface there plus 0.1 in for the 2 mm tessellation:
    # the bar, the body, the knob, and the screen tilted back toward the
    # user, which reaches outboard of the armrest.
    joystick_bar: [[3.9, -29.08, 13.0], [8.55, -25.16, 14.08]]
    joystick_body: [[8.34, -29.19, 13.0], [14.46, -24.78, 15.71]]
    joystick_knob: [[9.73, -28.01, 15.6], [11.5, -26.25, 18.48]]
    joystick_screen_low: [[14.25, -29.16, 13.11], [15.64, -25.08, 17.51]]
    joystick_screen_mid: [[15.43, -31.54, 14.48], [16.82, -25.08, 19.32]]
    joystick_screen_top: [[16.61, -31.54, 16.91], [19.23, -25.08, 20.2]]
    # UNMEASURED, kept where the RAMMS seat hulls put them relative to the arm
    # (inside the occupant, or behind it), at the occupant's width: they stay
    # when the person layer is excluded. The base's near side is 1 in further
    # from the arm than the occupant's, outside the seat's 35 mm keep-out, so
    # it is not carved into slivers; the occupant covers that inch.
    base: [[-13.63, -23.31, -6.23], [7.72, -5.32, 3.72]]
    backrest: [[-25.8, -23.31, 3.72], [-9.12, -4.31, 18.65]]


# The chair's cell stand-in: a slab whose top is the URDF's lowest point.
floor:
  half_extent_m: 1.5
  thickness_m: 0.1

# Written relative to the repository root. These are this checkout's copy:
# fixtures for the tests and the sim, NOT package data -- the layers describe
# one chair and ship with that robot, in rammp-deployments under
# config/robots/<robot>/curobo (issue #19). `--outdir` writes the robot's copy
# from the same rendered text.
outputs:
  platform: core/tests/data/mebot/layer_mebot_platform.yaml
  person: core/tests/data/mebot/layer_mebot_person.yaml
  seat: core/tests/data/mebot/layer_mebot_seat.yaml
  floor: core/tests/data/mebot/layer_mebot_floor.yaml
