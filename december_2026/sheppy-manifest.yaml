            - ./config/robots/current/cyclonedds.xml:/etc/cyclonedds/robot.xml:ro
            - ./config/dds/cyclonedds-fleet.xml:/etc/cyclonedds/fleet.xml:ro
            - /srv/rammp_feeding/config:/config     # the host's folders, owned by uid 1000 (rammp-feeding's docs/porting.md)
            - /srv/rammp_feeding/runs:/runs
          environment:
            CYCLONEDDS_URI: file:///etc/cyclonedds/fleet.xml,file:///etc/cyclonedds/robot.xml
            ROS_DOMAIN_ID: "0"
            HOME: /tmp
          # The node's executable (sheppy appends --ros-args --params-file with the params below)
          command: ["/module_ws/install/rammp_drinking/lib/rammp_drinking/drinking_node"]
        # Per robot, overridable from a profile (docs/interface.md, Parameters). The default is the December demo robot's
        # wrist camera (OAK-D Pro).
        params:
          use_orchestrator: true
          state_dir: /config
          runs_dir: /runs
          record: false                       # the run record: a debug setting, off
          camera_profile: oak_d_pro
          config: ""                          # any other setting, "a.b=1,c=[1, 2]"
        # (the camera's topics: the selected camera profile's, rammp_feeding's config/camera/*.yaml; these are the default's)
        subscribes:
          - /arm/robot_description
          - /joint_states
          - /control_status
          - /gripper_state
          - /tf
          - /tf_static
          - /wrist_camera/color/image_raw
          - /wrist_camera/color/camera_info
          - /wrist_camera/depth/image_rect_raw
        publishes:
          - /drinking/status
          - /setpoint/gripper
          - /reset
      # The real alternative's interface with no hardware: the same node with mock:=true (it registers and answers
      # every action at once; nothing moves).
      - id: drinking_mock
        kind: docker
        container:
          image: docker.io/debajyotidasgupta/rammp-drinking:0.1.4
          network_mode: host
          ipc: host
          volumes:
            # The fleet's DDS config and this robot's interface file, as every docker node here.
            - ./config/robots/current/cyclonedds.xml:/etc/cyclonedds/robot.xml:ro
            - ./config/dds/cyclonedds-fleet.xml:/etc/cyclonedds/fleet.xml:ro
          environment:
            CYCLONEDDS_URI: file:///etc/cyclonedds/fleet.xml,file:///etc/cyclonedds/robot.xml
            ROS_DOMAIN_ID: "0"
            HOME: /tmp
          command: ["ros2", "launch", "rammp_drinking", "drinking.launch.py", "mock:=true"]
        subscribes:
          - /arm/robot_description
          - /joint_states
          - /control_status
          - /gripper_state
          - /tf
          - /tf_static
          - /wrist_camera/color/image_raw
          - /wrist_camera/color/camera_info
          - /wrist_camera/depth/image_rect_raw
        publishes:
          - /drinking/status
          - /setpoint/gripper
          - /reset

  - name: fridge
    description: Fridge open and close -- the /fridge/execute_action capability engine (rammp-kitchen-capability-engines)
    select: single
    alternatives:
      # Transcribed from rammp-kitchen-capability-engines' capabilities/fridge/rammp-alternative.yaml
      # (and .mock.yaml) at engines dev adb94c3. Diverges from the fragment, as every kitchen engine
      # here: the fleet DDS config and robot interface file (as every docker node in this manifest),
      # the installed executable instead of `ros2 run`, its data on the host's daily tree instead of
      # /tmp, and `use_orchestrator` declared so a profile can run it standalone.
      #
      # Needs arm, arm_state_publisher and planner (nightly: arm_mount frame), static_tf, the wrist
      # camera, and sam3 when handle_source is sam3. profiles/daily.yaml brings all of them up.
      #
      # Run ONE fridge node. Two on the same DDS domain both serve /fridge/execute_action, both take
      # every goal and drive the arm against each other (11-05 on snorlax). Stop any `docker run`
      # fridge container before bringing this up.
      #
      # allow_execute false makes every goal a dry run (detect, plan, gate; nothing moves). Flip it in
      # the TUI (`p`) only for an attended run, someone on the e-stop -- never in a profile.
      #
      # Send a goal from december_2026/ on the robot (the image carries the action type):
      #   docker run --rm --network host --ipc host -e ROS_DOMAIN_ID=0 \
      #     -v "$PWD/config/robots/current/cyclonedds.xml:/etc/cyclonedds/robot.xml:ro" \
      #     -v "$PWD/config/dds/cyclonedds-fleet.xml:/etc/cyclonedds/fleet.xml:ro" \
      #     -e CYCLONEDDS_URI=file:///etc/cyclonedds/fleet.xml,file:///etc/cyclonedds/robot.xml \
      #     ghcr.io/rammp-org/rammp-kitchen-capability-engines/fridge:dev \
      #     ros2 action send_goal --feedback /fridge/execute_action \
      #     rammp_orchestrator_interfaces/action/ExecuteAction \
      #     '{engine_id: fridge, action_id: open, params_json: "{\"execute\": true, \"speed\": 0.2}"}'
      # action_id open or close; "execute": false for a dry run. A goal ending INVALID_GOAL "supervisor
      # rejected planned trajectory" right after planning usually means the arm is faulted: check
      # `Arm link` in the arm's log, then `ros2 service call /clear_faults std_srvs/srv/Trigger` with
      # nothing touching the arm. Each run's log and rosbag land in /home/snorlax/daily/data/fridge.
      - id: fridge_dev
        kind: docker
        ros_node_name: fridge
        container:
          # `:dev` moves on every merge to engines dev, and prefer_latest pulls it at every start (the
          # cached image if the pull fails). The daily demo holds it still with a merge freeze from 4 PM.
          image: ghcr.io/rammp-org/rammp-kitchen-capability-engines/fridge:dev
          pull_policy: prefer_latest
          network_mode: host
          ipc: host
          # The node's installed executable, as the image's CMD runs it; sheppy appends
          # `--ros-args --params-file`. Not `ros2 run`: as PID 1 it swallows the stop signal.
          command: ["/module_ws/install/fridge/lib/fridge/fridge_node"]
          environment:
            CYCLONEDDS_URI: file:///etc/cyclonedds/fleet.xml,file:///etc/cyclonedds/robot.xml
            ROS_DOMAIN_ID: "0"
          # The door geometry and grasp the open saves (the close reads them back) and every run's log:
          # kept on the host, across container restarts.
          volumes:
            # The fleet's DDS config and this robot's interface file, as every docker node here.
            - ./config/robots/current/cyclonedds.xml:/etc/cyclonedds/robot.xml:ro
            - ./config/dds/cyclonedds-fleet.xml:/etc/cyclonedds/fleet.xml:ro
            - /home/snorlax/daily/data/fridge:/fridge_data
            # The fridge's collision world for the cuRobo planner, written here and loaded by the planner
            # (set_world with its path): the planner container must mount the same host directory at the same
            # path (planner_world_dir), read-only is enough.
            - /tmp/rammp_planner_worlds:/rammp_planner_worlds
        params:
          # false: every goal is a dry run (detect, plan, gate; nothing moves), whatever it asks.
          # true only for attended runs, someone on the e-stop.
          allow_execute: false
          # false: the engine runs standalone, driven by `ros2 action send_goal`; true: it registers
          # with the orchestrator and waits for it (profiles/daily.yaml sets false until it runs).
          use_orchestrator: true
          data_dir: /fridge_data
          # The arm's forward lean in its mount (deg): 0 (dojo) or 30 (flatbot, gen_1_5).
          mount_tilt_deg: 0
          # The open's grasp: side (in along the door from the hinge side, one finger behind the bar, tilted
          # -40 to 40 deg) or front (fingers across the bar, straight in). Picks the placement advice.
          grasp: side
          # Wrist camera; depth must be aligned to colour. camera_frame "" = the colour image's frame_id.
          # depth/image_rect_raw is aligned to colour on the D405 and the OAK (flatbot); the D435i's is not --
          # with it, override this to /wrist_camera/aligned_depth_to_color/image_raw.
          color_topic: /wrist_camera/color/image_raw
          camera_info_topic: /wrist_camera/color/camera_info
          depth_topic: /wrist_camera/depth/image_rect_raw
          camera_frame: ""
