name: docs dispatch

# The docs site (rammp-org/rammp-org.github.io) draws each robot's cuRobo
# collision model from this repo's dev branch when it builds. Ask it to rebuild
# when that data changes; its 6-hourly rebuild covers a missed dispatch.
on:
  push:
    branches: [dev]
    paths:
      - '*/config/robots/*/curobo/**'
      - '*/config/robots/*/mount.yaml'
  workflow_dispatch:

permissions: {}

jobs:
  dispatch:
    runs-on: ubuntu-latest
    # DOCS_DISPATCH_TOKEN may not be provisioned for this repo; skip cleanly
    # rather than failing red on every push. `secrets` is not a usable context
    # in an `if:` at any level, so it is routed through `env:` first, which the
    # step's `if:` can read. (Same shape as kinova-gen3-ros2's and sheppy's.)
    env:
      DOCS_DISPATCH_TOKEN: ${{ secrets.DOCS_DISPATCH_TOKEN }}
    steps:
      - if: ${{ env.DOCS_DISPATCH_TOKEN != '' }}
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ env.DOCS_DISPATCH_TOKEN }}
          repository: rammp-org/rammp-org.github.io
          event-type: docs-updated
      - if: ${{ env.DOCS_DISPATCH_TOKEN == '' }}
        run: echo "DOCS_DISPATCH_TOKEN is not set; the docs site picks this up on its next scheduled rebuild."
