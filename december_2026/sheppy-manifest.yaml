# Sheppy manifest for the December 2026 demo. Launch from the demo machine:
#   sheppy december_2026/sheppy-manifest.yaml
#
# Cameras, the arm and operator teleop so far; the demo modules land here as their module repos
# publish fragments.
#
# Every node carries a mock alternative alongside the real one, so a profile
# selecting only mocks runs on a workstation with no hardware attached. The
# mocks publish empty messages at the right topic and type — enough to develop
# wiring against, and deliberately not a simulation.
#
# DDS: everything here speaks Cyclone. The arm, the planner and (from 0.1.0) the
# camera images are all built FROM rammp-base, which sets RMW_IMPLEMENTATION and
# a tuned CYCLONEDDS_URI — so no node below sets either, and overriding one
# would strip the fleet config with it.
#
# Container definitions are inline rather than a `compose:` reference: sheppy
# resolves a compose file relative to this manifest, so a reference would mean
# carrying a second copy of the dojo's compose.yaml here to drift against.
# Inline blocks are not variable-interpolated (compose files are), so anything
# that was `${VAR:-default}` in the dojo is spelled out below.
machines: []
nodes:
  - name: scene_camera
    description: Orbbec Gemini 336L, scene view
    select: single
    alternatives:
      # Built and published by rammp-suite-software.
      - id: gemini336l_docker
        kind: docker
        container:
          image: ghcr.io/rammp-org/rammp-suite-software/gemini:0.1.0
          # Userspace-USB device: privileged + /dev survives replugs. The
          # camera needs no root, so it runs as the host user.
          privileged: true
          network_mode: host
          ipc: host
          volumes:
            - /dev:/dev
          user: "1000:1000"
          environment:
            ROS_DOMAIN_ID: "0"
            HOME: /tmp
          command: ros2 launch orbbec_camera gemini_330_series.launch.py camera_name:=scene_camera
        publishes:
          - /scene_camera/color/image_raw
          - /scene_camera/depth/image_raw
          - /scene_camera/depth/points
      - id: scene_camera_mock
        kind: process
        command: "bash -lc 'source /opt/ros/humble/setup.bash && ros2 topic pub -r 10 /scene_camera/color/image_raw sensor_msgs/msg/Image \"{}\"'"
        publishes:
          - /scene_camera/color/image_raw

  - name: wrist_camera
    description: Wrist-mounted RGB-D camera — RealSense D405 or OAK-D Pro
    select: single
    alternatives:
      - id: d405_docker
        kind: docker
        container:
          image: ghcr.io/rammp-org/rammp-suite-software/realsense:0.1.0
          privileged: true
          network_mode: host
          ipc: host
          volumes:
            - /dev:/dev
          # gid 44 = video: librealsense streams over V4L2, and /dev/video* is
          # root:video 0660. The Orbbec needs no such group (libusb, node 0666).
          user: "1000:44"
          environment:
            ROS_DOMAIN_ID: "0"
            HOME: /tmp
          # camera_namespace:=/ keeps topics at /wrist_camera/... instead of
          # rs_launch.py's default /camera/wrist_camera/...
          command: ros2 launch realsense2_camera rs_launch.py camera_name:=wrist_camera camera_namespace:=/
        publishes:
          - /wrist_camera/color/image_raw
          - /wrist_camera/depth/image_rect_raw
      # Same topics as the D405, so consumers cannot tell which is selected —
      # except at range: the D405 sees from ~7 cm, this from ~15-30 cm (75 mm
      # baseline, even with the near-field tuning in the image's wrist.yaml:
      # ROBOTICS preset, extended disparity, dot projector on).
      - id: oak_d_pro_docker
        kind: docker
        container:
          image: ghcr.io/rammp-org/rammp-suite-software/oak:0.1.0
          # PoE camera: reached over the network, so no /dev and no privileges.
          network_mode: host
          ipc: host
          environment:
            ROS_DOMAIN_ID: "0"
          # The node binary, not driver.launch.py: with rs_compat that launch
          # file forces a /camera namespace, and wrist.yaml spells out what it
          # would have set. Exec'd directly it is PID 1 and gets SIGTERM.
          command:
            - /opt/ros/humble/lib/depthai_ros_driver_v3/driver_node
            - --ros-args
            - -r
            - __node:=wrist_camera
            - --params-file
            - /etc/rammp/oak/wrist.yaml
            - -p
            - driver.i_ip:=192.168.1.200
        publishes:
          - /wrist_camera/color/image_raw
          - /wrist_camera/depth/image_rect_raw
      - id: wrist_camera_mock
        kind: process
        command: "bash -lc 'source /opt/ros/humble/setup.bash && ros2 topic pub -r 10 /wrist_camera/color/image_raw sensor_msgs/msg/Image \"{}\"'"
        publishes:
          - /wrist_camera/color/image_raw

  - name: foxglove
    description: Foxglove bridge — WebSocket on :8765 for inspecting the graph
    select: single
    alternatives:
      # Built and published by rammp-tools. On rammp-base like every
      # other node here: only a Cyclone participant with the fleet config can
      # see the fleet's topics, which is the whole point of a bridge.
      - id: foxglove_bridge_docker
        kind: docker
        container:
          image: ghcr.io/rammp-org/rammp-tools/foxglove:0.1.0
          network_mode: host
          ipc: host
          environment:
            ROS_DOMAIN_ID: "0"
          command: ros2 launch foxglove_bridge foxglove_bridge_launch.xml
        # No topics: it is a WebSocket server, reached at ws://<machine>:8765
        # from Foxglove (Open connection → Foxglove WebSocket). Camera-specific
        # services (orbbec_camera_msgs, realsense2_camera_msgs) are skipped
        # with a warning at startup — their type packages are not in the
        # image; every topic and every sensor_msgs service is bridged.
        publishes: []
        subscribes: []
      # No mock: nothing in the graph consumes it, so an unselected node costs
      # a workstation profile nothing.

  - name: arm
    description: Kinova Gen3 7-DoF on a 2F-85 gripper
    select: single
    alternatives:
      # Transcribed from kinova-gen3-ros2's rammp-alternative.yaml. That
      # fragment uses `compose:` against the module's own deploy/compose.yaml,
      # which builds images locally; inline here, pinned to the release, per
      # this file's convention.
      #
      # The module is TWO containers — this one and the `planner` node below.
      # Three of its four action servers (go_to_ee_pose, go_to_joint_config,
      # go_to_preset) accept goals that can NEVER succeed without the planner,
      # and sheppy ignores depends_on, so the pairing lives here.
      - id: kinova_gen3_driver
        kind: docker
        # Keys the params file sheppy writes, so the params below land on this
        # node rather than the /** wildcard. arbitration_mode is READ-ONLY at
        # launch, so a params file at startup is the only way it can be set.
        ros_node_name: kinova_gen3_node
        container:
          image: ghcr.io/rammp-org/kinova-gen3-ros2:1.0.1
          network_mode: host
          ipc: host
          # SYS_NICE permits sched_setscheduler; the ulimits are what let it
          # SUCCEED. Capabilities are not rlimits — `privileged: true` raises
          # the first and not the second, so it is NOT a substitute here.
          # (abra is RT-tuned with isolcpus=11 nohz_full=11 rcu_nocbs=11, which
          # no container contract can express — this only makes RT possible.)
          cap_add: [SYS_NICE]
          ulimits:
            rtprio: 99
            memlock: -1
          # No RMW_IMPLEMENTATION here: the image is built FROM rammp-base,
          # which sets Cyclone plus CYCLONEDDS_URI. Overriding it would strip
          # the tuned config with it.
          environment:
            ROS_DOMAIN_ID: "0"
          # Run as root: the RT loop needs the rlimits above.
          #
          # Paths are /module_ws, NOT the /ros2_ws the module's own
          # deploy/compose.yaml still says: rammp-base owns /ros2_ws (the
          # interface contract) and this node builds into /module_ws on top.
          command:
            - /module_ws/install/kinova_gen3_ros2/lib/kinova_gen3_ros2/kinova_gen3_node
            - --ip
            - 192.168.1.10
            - --urdf
            - /module_ws/src/kinova-gen3-driver/models/gen3_7dof_2f85.urdf
            # Pins ONLY the 1 kHz RT loop to abra's isolated core, not the
            # whole container — --cpuset-cpus would drag the ROS threads onto
            # it too. Without --cpu the node sets no affinity at all.
            - --cpu
            - "11"
        params:
          arbitration_mode: disabled
          estop_clear_max_age_s: 1.0
          expect_gripper: true
        publishes:
          - /joint_states
          - /ee_state
          - /control_status
          - /stream_status
          - /gripper_state
          - /diagnostics
        subscribes:
          - /estop
          - /setpoint/joint_position
          - /setpoint/joint_velocity
          - /setpoint/joint_torque
          - /setpoint/pose
          - /setpoint/twist
          - /setpoint/gripper
      # The image also ships a --sim mode that is a real simulated arm, but it
      # is arm64-only, so it would not serve the "runs on a workstation" job
      # this mock exists for. Publish-only, as above.
      - id: arm_mock
        kind: process
        command: "bash -lc 'source /opt/ros/humble/setup.bash && ros2 topic pub -r 100 /joint_states sensor_msgs/msg/JointState \"{}\"'"
        publishes:
          - /joint_states

  - name: planner
    description: cuRobo motion planner for the arm's go_to_* actions
    select: single
    alternatives:
      # Owned by rammp-org/RAMMP-CuRobo; declared here because sheppy cannot
      # express "and also start that one". Its own rammp-alternative.curobo.yaml
      # in kinova-gen3-ros2 says the same thing against a local build.
      - id: curobo_planner
        kind: docker
        container:
          image: ghcr.io/rammp-org/rammp-curobo:1.0.0
          runtime: nvidia              # JetPack exposes the GPU this way, NOT --gpus
          network_mode: host
          ipc: host
          environment:
            ROS_DOMAIN_ID: "0"
          # The first plan after a cold start compiles CUDA kernels — minutes,
          # during which go_to_* goals just sit there. The named volume keeps
          # them across restarts, so only the very first run pays.
          volumes:
            - curobo_kernel_cache:/root/.cache
        # No topics: this node is reached over the /rammp_curobo/plan_to_pose
        # and /rammp_curobo/plan_to_joints ACTIONS, which the schema has no way
        # to declare. Nothing here is starved; there is just nothing to list.
        publishes: []
        subscribes: []
      # No mock. The mock convention here is "publish an empty message at the
      # right topic and type", and an action server has no topic to publish —
      # a mock would have to implement the action to be worth anything. Select
      # arm_mock and leave this node unselected instead.

  - name: arm_teleop
    description: Operator input (Xbox pad or Meta Quest 3) -> the arm's streaming tier
    select: single
    alternatives:
      # Transcribed from rammp-org/rammp-teleop's rammp-alternative.{xbox,quest}.yaml,
      # pinned to its release. (Its quest-mock fragment is not carried here; the
      # mock convention in this file is arm_mock plus an unselected teleop.) Each alternative acquires
      # control of the arm and opens a stream, so the `arm` node must be
      # selected alongside; a profile that does not want teleop simply leaves
      # this node unselected. Nothing moves until the operator engages (stick
      # deflection on the pad, grip squeeze on the Quest).
      #
      # Xbox pad over USB: privileged + /dev:/dev so joy_node can open
      # /dev/input/js0. Streams base-frame twists (ee_twist).
      - id: xbox_pad
        kind: docker
        container:
          image: ghcr.io/rammp-org/rammp-teleop:0.1.0
          network_mode: host
          ipc: host
          privileged: true
          volumes:
            - /dev:/dev
          environment:
            ROS_DOMAIN_ID: "0"
          command: /module_ws/src/rammp-teleop/scripts/launch_entry.py rammp_teleop xbox.launch.py
        publishes:
          - /setpoint/twist
          - /setpoint/gripper
          - /estop
        subscribes:
          - /ee_state
          - /joint_states
          - /gripper_state
          - /stream_status
          - /control_status
      # Meta Quest 3 plugged into the Jetson over USB-C: quest_reader talks to
      # the headset over adb (needs /dev/bus/usb) and quest_teleop streams
      # clutched poses on ee_pose_impedance. ~/.android holds the adb key the
      # headset authorized ("Always allow from this computer"); without that
      # mount every container start re-prompts the headset. ~/.config/rammp_teleop
      # holds the controller->base calibration the operator redoes from the
      # controller (hold A) after each headset reboot, so it survives restarts.
      - id: quest3
        kind: docker
        container:
          image: ghcr.io/rammp-org/rammp-teleop:0.1.0
          network_mode: host
          ipc: host
          privileged: true
          volumes:
            - /dev:/dev
            - /home/abra/.android:/root/.android
            - /home/abra/.config/rammp_teleop:/config
          environment:
            ROS_DOMAIN_ID: "0"
          command: /module_ws/src/rammp-teleop/scripts/launch_entry.py rammp_teleop quest.launch.py r_align_file:=/config/quest_r_align.json
        publishes:
          - /setpoint/pose
          - /setpoint/gripper
          - /estop
          - /quest/right/pose
          - /quest/joy
        subscribes:
          - /ee_state
          - /joint_states
          - /gripper_state
          - /stream_status
          - /control_status
