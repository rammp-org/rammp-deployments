# gen_1_5's planner with NO collision volumes: the arm and nothing else. Not the
# chair, not the seat, not the occupant, not the floor.
#
# The other choice is planner.yaml, beside this file: the same arm with the
# chair, seat and occupant in every world. Each profile picks one:
#
#   profiles/gen_1_5.yaml              config:=/config/robot/curobo/planner.yaml
#   profiles/gen_1_5_empty_world.yaml  config:=/config/robot/curobo/planner_empty_world.yaml
#
# For attended work where the layers get in the way, such as a rest pose they
# refuse. Plans from here can run straight through the chair and the person
# sitting in it, so someone stays on the e-stop and watches every motion.
#
# robot.yaml (the arm's spheres and kinematics check) is the same file
# planner.yaml uses. A set_world push still adds whatever scene it carries, and
# /reset returns to this empty world.

robot: robot.yaml
world: world_empty.yaml

# Repeatable plans (RAMMP-CuRobo#74; an image without it ignores these keys).
# 512 IK seeds find the IK solutions nearest the start every call, and the
# reseed makes one request give one plan: on that repo's chair bench, the same
# request no longer ends ~4.4 rad apart between calls, the goal is ~18% nearer
# and the swept volume ~8% smaller, with no plans lost. The seed count is fixed
# at start-up. graph_fallback (the graph planner after a failed attempt) stays
# off until it is verified on the Jetson.
planner:
  num_ik_seeds: 512
  reseed_each_plan: true
  graph_fallback: false
