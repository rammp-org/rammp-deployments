            CYCLONEDDS_URI: file:///etc/cyclonedds/fleet.xml,file:///etc/cyclonedds/robot.xml
            ROS_DOMAIN_ID: "0"
          # state_dir: the marked spot, the start position and the descent recordings, kept across restarts.
          volumes:
            # The fleet's DDS config and this robot's interface file, as every docker node here.
            - ./config/robots/current/cyclonedds.xml:/etc/cyclonedds/robot.xml:ro
            - ./config/dds/cyclonedds-fleet.xml:/etc/cyclonedds/fleet.xml:ro
            - /home/snorlax/daily/data/place_container:/config/place_container
        params:
          # The arm moves only with this true AND `execute` in the goal; otherwise every goal is a dry run.
          # true only for attended runs, someone on the e-stop.
          allow_execute: false
          # false: the engine runs standalone, driven by `ros2 action send_goal`; true: it registers
          # with the orchestrator and waits for it (profiles/daily.yaml sets false until it runs).
          use_orchestrator: true
          # Flange face to the closed fingertips (m): where the container centre lands. Not ruler-measured yet.
          flange_to_tip: 0.17955
          # The hand points this many deg down while placing, so the container touches before the fingers.
          pitch_deg: 5.0
          # Contact: the hand's z velocity (m/s, + up) back up to this after moving down.
          vz_stop: -0.01
          # The hold after contact, this far (m) below the contact point, while the gripper opens.
          hold_press: 0.003
          # Held in impedance at the start this long (s) before going down; must end still. 0 = no pause.
          settle_s: 0.0
          # Contact is ignored until the descent's command has gone this far down (m): the sag when the arm
          # goes compliant must not read as contact.
          contact_ignore_m: 0.08
          # Contact more than this (m) above where the bottom meets the table = not the table.
          early_stop: 0.03
          # Joint impedance for the settle, lowering, hold, retreat and reset (one set: the stiffness never changes
          # mid-place). The driver's documented starting point, not the "medium" profile RAMMP-table used.
          impedance_kq: [80.0, 80.0, 80.0, 80.0, 30.0, 30.0, 30.0]
          impedance_zeta: 0.5
          impedance_torque_limit: [39.0, 39.0, 39.0, 39.0, 9.0, 9.0, 9.0]
          # Speeds. The hand's speed where the table should be (m/s): what the contact test was tuned at.
          lower_speed: 0.02
          # The rest is 2x RAMMP-table's: speed_scale of the carrying moves (go_to_ee_poses; and reset's),
          go_to_speed_scale: 0.6
          # of the squaring turn and of reset's joint moves (move_joints),
          adjust_speed_scale: 1.0
          reset_speed_scale: 1.0
          # and the retreat's peak speed (m/s).
          retreat_speed: 0.10
          # reset: curobo = one go_to_joint_configs motion (up, then the start) around the chair's collision
          # volumes, at go_to_speed_scale; legacy = the impedance move_joints moves (no chair check).
          reset_mode: curobo
          # blend_radius (m) where a blended motion passes a waypoint near the table or the container (the
          # table is not in cuRobo's world) ...
          blend_radius_near: 0.03
          # ... and up at the carrying height.
          blend_radius_far: 0.05
          # Before lowering (and in a dry run), ask cuRobo whether the ends of the line down and the retreat,
          # which it doesn't plan, are clear of the chair's collision volumes.
          curobo_check: true
          # adjust -> lift -> transit as ONE go_to_ee_poses motion (cuRobo, blended at the waypoints, at
          # go_to_speed_scale); false = separate moves as on 2026-10-29 (adjust on move_joints).
          blend: true
          # With blend: pose = the squaring turn is the motion's first target (unheld); joints = a
          # go_to_joint_config to our checked joints first (if cuRobo swings the hand for the pose), then
          # lift -> transit.
          adjust_mode: pose
          # With blend: joints = the carrying motion through our planned joints (go_to_joint_configs), so the
          # arm keeps the start's posture; pose = hand poses, cuRobo picks the joints (it chose another posture
          # at the spot on 2026-11-10, and reset could not undo it).
          carry_targets: joints
          # After the gripper opens, the hand goes this far (m) straight down before the retreat, which then
          # doesn't lift; 0.0 = off (the retreat lifts by hold_press).
          release_drop: 0.01
          # The slow impedance lowering starts this far (m) above where the container's bottom meets the
          # table; the carrying motion takes the hand straight down to there first. 0.0 = all of it slow.
          lower_from: 0.06
          # Spot distance from the arm base axis (m) with the full descent (flatbot, table z 0.198). Arm
          # kinematics, measured without the chair volumes: re-measure. Outside it the plan decides.
          reach: [0.70, 1.10]
          # Where the line down can't reach the table in the arm's posture, switch to another posture that can
          # (go_to_joint_config: a bigger move, no level hold); false = refuse instead.
          allow_reconfigure: false
          # The squaring turn may correct at most this much (deg).
          max_adjust_deg: 15.0
          # A marked spot older than this (min) is refused: the chair may have moved.
          max_spot_age_min: 30.0
          # The arm's tool frame vs the model's (m).
          tool_frame_tol: 0.015
          # Where the marked spot, the start position and the descent recordings are kept.
          state_dir: /config/place_container
          # A spot or start position saved before this (unix s) is refused: 2026-11-07 17:56 UTC, when the arm
          # moved 8 in forward on the flatbot's chair (rammp-deployments #156).
          state_valid_after: 1794074180.0
          # A failure is shown on the user's UI panel with an OK button; the action waits this long (s) for
          # the OK before it ends with the error. 0 = don't wait.
          ui_error_wait_s: 60.0
          # After letting go: legacy = the slow separate moves of 2026-11-10 (drop, back out, swing), ending
          # by the container (the UI's place_here then runs reset); blended = drop, back out and go back to the
          # start as ONE impedance go_to_joint_configs motion (cuRobo, blended). legacy since 2026-11-12: cuRobo
          # rejected its own plan of the short retreat (J2 acceleration) every time on flatbot.
          return_mode: legacy
          # speed_scale of that motion's legs by the container; the way up and over goes at go_to_speed_scale.
          return_speed_scale: 0.3
          # A rosbag + run.json for every action run in <state_dir>/runs/ (place_container/bag.py).
          record_bag: true
          bag_state_hz: 25.0
          bag_frame_hz: 1.0
          # The scene camera's colour, camera_info and depth in the bag, for context.
          bag_camera: true
          bag_camera_topics:
            - /scene_camera/color/image_raw
            - /scene_camera/color/camera_info
            - /scene_camera/depth/image_rect_raw
          # Mock only: place fails at this phase (carry, lower, open, return), to try the UI's error panel.
          mock_fail: ""
          # place_here's tap-to-place (place_container/spots.py): the scene camera's depth (aligned to colour), its
          # camera_info, and the scene segmenter's detections (the table's mask; "" = a plane fit to the depth only).
          scene_depth_topic: /scene_camera/depth/image_rect_raw
          scene_info_topic: /scene_camera/color/camera_info
          detections_topic: /perception/object_detections
          # Wait this long (s) for the scene camera's depth, camera_info and tf.
          scene_wait_s: 3.0
          # The offered spots: this far apart (m); the table must reach this far past the container's footprint (m);
          # nothing on the table closer to the footprint than this (m).
          spot_step: 0.09
          spot_edge_margin: 0.03
          spot_clearance: 0.03
          # The table's height at the chosen spot (a plane fitted to the depth around it) is raised by this (m): the
          # descent stops on contact, so erring high is safe.
          table_z_bias: 0.01
          # A table more tilted than this (deg) to the scene camera: the camera's mount is off, no spots offered.
          max_table_tilt_deg: 3.0
          # With a marked spot: the camera's table height there more than this (m) from the arm's mark = no spots.
          table_check_tol: 0.03
          # Where a table may be (m, arm_mount z), for the plane fit without the segmenter's table mask.
          table_z_range: [-0.10, 0.50]
          # arm.*: every tunable of self.arm; see Parameters in docs/interface.md.
          "arm.tool_z": 0.12
          "arm.dt": 0.02
          "arm.joint_speed": 0.85
          "arm.cart_speed": 0.16
          "arm.contact_joint_speed": 0.5
          "arm.contact_cart_speed": 0.09
          "arm.min_duration_s": 1.0
          "arm.cart_step_m": 0.02
          "arm.cart_step_deg": 5.0
          "arm.rot_equiv_m": 0.15
          "arm.max_knot_jump_deg": 20.0
          "arm.path_tol_rad": 0.15
          "arm.gripper_force": 0.5
          "arm.gripper_speed": 0.5
          "arm.frame": "arm_mount"
          "arm.go_to_speed_scale": 0.3
          "arm.go_to_timeout_s": 120.0
          "arm.go_to_track_m": 0.01
          "arm.go_to_track_deg": 2.0
          "arm.max_ik_err": 0.02
          "arm.max_step_jump_deg": 20.0
          "arm.j6_guard_deg": 115.0
          "arm.j4_guard_deg": 144.0
          "arm.max_continuous_delta_deg": 170.0
          "arm.keep_out_err": 9.0
          "arm.ik_max_iterations": 200
          "arm.clearance_query_m": 0.5
          "arm.fingertip_open_rad": 0.0
          "arm.finger_closed_rad": 0.7
          "arm.state_wait_s": 10.0
          "arm.state_stale_s": 0.5
          "arm.diagnostics_stale_s": 3.0
          "arm.goal_accept_s": 5.0
          "arm.result_margin_s": 30.0
          "arm.poll_s": 0.01
          "arm.cancel_settle_s": 0.4
          "arm.halt_status_wait_s": 0.2
          "arm.planner_wait_s": 5.0
          "arm.go_to_settle_s": 0.3
          "arm.gripper_period_s": 0.02
          "arm.gripper_moved": 0.002
          "arm.gripper_judge_after_s": 0.5
          "arm.gripper_still_s": 0.3
          "arm.plan_timeout_s": 30.0
          "arm.service_wait_s": 5.0
          "arm.service_call_s": 10.0
          "arm.stream_timeout_s": 0.1
          "arm.publisher_match_s": 1.0
          "arm.close_stream_wait_s": 1.0
          "arm.mock_joints": [0.0, 0.26, 3.14, -2.27, 0.0, 0.96, 1.57]
          "arm.mock_urdf": ""
          # The UI bridge node ctx.update_user_panel / poll_ui_event talk to (the engine declares it); a
          # deployment with a differently named bridge overrides this.
          "ui_bridge_node_name": "ui_bridge_node"
        publishes: [/place_container/status]
        subscribes:
          # place_here's tap-to-place (during that action only): the scene camera's depth and camera_info, the scene
          # segmenter's detections (the table's mask), tf (arm_mount <- the camera); and the run bag's camera topics
          - /tf
          - /tf_static
          - /scene_camera/color/image_raw
          - /scene_camera/color/camera_info
          - /scene_camera/depth/image_rect_raw
          - /perception/object_detections
